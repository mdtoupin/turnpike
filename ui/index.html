}
/* ============================================================ 9. HEADER */
function paintHeader(){
  const p=S.sel?pd(S.sel).project:null;
  const name=$("h-name"), st=$("h-status"), topic=$("h-topic");
  if (!S.sel){
    name.textContent=S.globalView==="needs"?"Needs you":"Activity";
    st.classList.add("hidden");
    topic.textContent=S.globalView==="needs"?"Blockers and questions no one has answered"
      :"Everything across all projects";
    topic.classList.add("no-goal");
    $("h-segs").classList.add("hidden"); $("b-filter").classList.add("hidden");
    $("b-summon").parentElement.classList.add("hidden"); $("b-insp").classList.add("hidden");
    return;
  }
  $("h-segs").classList.remove("hidden"); $("b-filter").classList.remove("hidden");
  $("b-summon").parentElement.classList.remove("hidden"); $("b-insp").classList.remove("hidden");
  name.textContent=p?(p.name||p.slug):S.sel;
  st.classList.remove("hidden"); st.textContent=p?p.status:"";
  st.classList.toggle("act", !!p && p.status==="active");
  const goal=p&&p.goal?p.goal:"";
  topic.textContent=goal||"Set a goal with the CLI";
  topic.classList.toggle("no-goal",!goal);
  topic.title=goal;
  const d=pd(S.sel);
  const tasks=[...d.tasks.values()].filter(t=>t.status!=="dropped");
  $("seg-n").textContent=tasks.length?(tasks.filter(t=>t.status==="done").length+"/"+tasks.length):"";
  const f=filters(S.sel);
  $("b-filter").classList.toggle("on", !f.commits||!f.tasks);
  $("b-filter").classList.toggle("dotmark", !f.commits||!f.tasks);
  /* segmented thumb */
  const segs=[...$("h-segs").querySelectorAll(".seg")];
  segs.forEach(s=>s.classList.toggle("on", s.dataset.view===S.view));
  const on=segs.find(s=>s.dataset.view===S.view);
  if (on){ const t=$("h-thumb"); t.style.width=on.offsetWidth+"px";
    t.style.transform="translateX("+(on.offsetLeft-2)+"px)"; }
  $("b-insp").classList.toggle("on", S.insp.open);
}
function filterPop(anchor){
  if (!S.sel) return;
  const d=pd(S.sel), f=filters(S.sel);
  const nc=(d.git&&d.git.commits)?d.git.commits.length:0;
  const nt=d.order.filter(id=>d.messages.get(id).kind==="task").length;
  openPop(anchor,(p)=>{
    p.appendChild(el("div","hd","Show in timeline"));
    popItem(p,"Commits",{right:String(nc),toggle:f.commits,onClick:(e,b)=>{
      f.commits=!f.commits; b.classList.toggle("on",f.commits); ls.set("tp.filter."+S.sel,f);
      paintTimeline(); paintHeader(); }});
    popItem(p,"Task events",{right:String(nt),toggle:f.tasks,onClick:(e,b)=>{
      f.tasks=!f.tasks; b.classList.toggle("on",f.tasks); ls.set("tp.filter."+S.sel,f);
      paintTimeline(); paintHeader(); }});
  },{right:true,width:240});
}
function summonPop(anchor){
  openPop(anchor,(p,close)=>{
    p.appendChild(el("div","hd","Summon to this project"));
    for (const n of AGENTS){
      const a=agentOf(n);
      popItem(p,n,{avatar:n,hue:hue(n),right:a?ago(a.last_seen):"never seen",
        onClick:()=>{ close(); summon(n); }});
    }
  },{right:true,width:240});
}
async function summon(agent){
  if (!S.sel) return;
  const btn=$("b-summon"), lbl=$("summon-lbl");
  btn.disabled=true; const old=lbl.textContent;
  lbl.textContent=""; const sp=el("span","spin"); lbl.appendChild(sp);
  const r=await api("/api/summon",{slug:S.sel,agent});
  lbl.textContent="";
  if (r&&r.ok){ lbl.appendChild(icon("i-check","ic-sm")); lbl.appendChild(document.createTextNode(" Summoned"));
    setTimeout(()=>{ lbl.textContent=old; btn.disabled=false; },2400); }
  else { lbl.textContent=old; btn.disabled=false; toast((r&&r.error)||"Summon failed",{bad:true,action:"Retry",onAction:()=>summon(agent)}); }
}
/* ============================================================ 10. COMPOSER */
function loadDraft(slug){
  const d=S.ui.drafts[slug]||ls.get("tp.draft."+slug,null);
  $("c-body").value=d?d.body:"";
  setKind(d&&d.kind?d.kind:"note");
  autoGrow();
}
function saveDraft(){
  if (!S.sel) return;
  const body=$("c-body").value;
  if (body.trim()){ const rec={kind:S.ui.kind,body}; S.ui.drafts[S.sel]=rec; ls.set("tp.draft."+S.sel,rec); }
  else { delete S.ui.drafts[S.sel]; try{localStorage.removeItem("tp.draft."+S.sel);}catch(e){} }
}
function setKind(k){
  S.ui.kind=k;
  $("c-kind-l").textContent=k;
  document.querySelector("#c-kind .kd").style.background=KIND_HUE[k]||"var(--tx-4)";
  const c=$("composer");
  c.classList.toggle("k-directive",k==="directive");
  c.classList.toggle("k-question",k==="question");
  const ph = k==="directive" ? "Directive to all agents (overrides their current plan)…"
    : k==="question" ? "Ask the agents a question (they answer before continuing)…"
    : "Message "+(S.sel?"#"+S.sel:"");
  $("c-body").placeholder=ph;
}
function autoGrow(){
  const t=$("c-body"); t.style.height="auto";
  t.style.height=Math.min(240,Math.max(44,t.scrollHeight))+"px";
}
function kindPop(anchor){
  openPop(anchor,(p,close)=>{
    for (const [k,desc] of POST_KINDS)
      popItem(p,k,{sub:"- "+desc,hue:KIND_HUE[k],onClick:()=>{ setKind(k); saveDraft(); close(); }});
  },{up:true,width:300});
}
let tmpSeq=0;
async function post(){
  const body=$("c-body").value.trim();
  if (!body || !S.sel) return;
  const kind=S.ui.kind, slug=S.sel;
  const tmp={id:"tmp"+(++tmpSeq), author:"user", kind, body, created_at:new Date().toISOString(), optimistic:true};
  const d=pd(slug); d.messages.set(tmp.id,tmp); d.order.push(tmp.id);
  $("c-body").value=""; autoGrow(); saveDraft();
  paintTimeline();
  const row=$("timeline").querySelector('[data-msg="'+tmp.id+'"]');
  if (row) row.style.opacity=".55";
  const fail=setTimeout(()=>{
    const r=$("timeline").querySelector('[data-msg="'+tmp.id+'"]');
    if (r){ r.classList.add("k-blocker");
      toast("Message not confirmed",{bad:true,action:"Retry",onAction:()=>{ $("c-body").value=body; post(); }}); }
  },8000);
  const r=await api("/api/post",{slug,kind,body});
  clearTimeout(fail);
  if (!r || r.error){
    d.messages.delete(tmp.id); d.order=d.order.filter(x=>x!==tmp.id); paintTimeline();
    toast((r&&r.error)||"Post failed",{bad:true,action:"Retry",onAction:()=>{ $("c-body").value=body; post(); }});
    return;
  }
  tmp.confirmedId=r.id;
  setReadMark(slug, r.id);
  scheduleFetch(true);
}
/* ============================================================ 11. BOARD */
function boardTasks(){
  const d=pd(S.sel); const cols={todo:[],doing:[],blocked:[],done:[]};
  for (const t of d.tasks.values()) if (cols[t.status]) cols[t.status].push(t);
  cols.done.sort((a,b)=> (a.updated_at<b.updated_at?1:-1));
  return cols;
}
function paintBoard(){
  const host=$("board");
  if (!host.dataset.built){ buildBoardShell(host); host.dataset.built="1"; }
  const cols=boardTasks();
  for (const st of COLS){
    const colEl=host.querySelector('.col[data-status="'+st+'"]');
    const cards=colEl.querySelector(".cards");
    let list=cols[st];
    let older=0;
    if (st==="done" && !S.ui.doneShowAll && list.length>10){ older=list.length-10; list=list.slice(0,10); }
    colEl.querySelector(".n").textContent=cols[st].length;
    renderList(cards, list, t=>"t"+t.id, createCard, patchCard,
      t=>t.id+":"+t.status+":"+t.assignee+":"+t.title.length);
    let more=colEl.querySelector(".showolder");
    if (older>0){ if (!more){ more=el("button","showolder"); more.addEventListener("click",()=>{ S.ui.doneShowAll=true; paintBoard(); }); colEl.appendChild(more); }
      more.textContent="Show "+older+" older"; }
    else if (more) more.remove();
  }
  const total=[...pd(S.sel).tasks.values()].filter(t=>t.status!=="dropped").length;
  if (!total) emptyBoard(host); else { const e=host.querySelector(".emptystate"); if (e) e.parentElement.remove(); }
}
function emptyBoard(host){
  if (host.querySelector(".emptystate")) return;
  const w=el("div"); w.style.cssText="grid-column:1/-1";
  const [ic,title,body,action,fn]=EMPTY.board;
  const e=el("div","emptystate"); e.appendChild(icon(ic)); e.appendChild(el("h2",null,title));
  e.appendChild(el("p",null,body)); const b=el("button","btn",action);
  b.addEventListener("click",fn); e.appendChild(b); w.appendChild(e); host.appendChild(w);
}
function buildBoardShell(host){
  resetList(host);
  for (const st of COLS){
    const c=el("div","col"); c.dataset.status=st; c.setAttribute("role","list");
    const h=el("h3"); h.appendChild(el("span",null,st)); h.appendChild(el("span","n","0"));
    h.appendChild(el("span","sp"));
    if (st==="todo"){ const add=el("button","gb"); add.appendChild(icon("i-plus","ic-sm"));
      add.title="Add task (t)"; add.addEventListener("click",startAddTask); h.appendChild(add); }
    c.appendChild(h);
    c.appendChild(el("div","cards"));
    if (st==="todo"){ const ar=el("button","addrow"); ar.appendChild(icon("i-plus","ic-sm"));
      ar.appendChild(el("span",null,"Add task")); ar.addEventListener("click",startAddTask); c.appendChild(ar); }
    c.addEventListener("dragover",e=>{ e.preventDefault(); c.classList.add("over"); });
    c.addEventListener("dragleave",()=>c.classList.remove("over"));
    c.addEventListener("drop",e=>{ e.preventDefault(); c.classList.remove("over");
      if (S.ui.dragId!=null) moveTask(S.ui.dragId, st); S.ui.dragId=null; S.ui.dragging=false; });
    host.appendChild(c);
  }
}
function createCard(t){
  const c=el("div","card"); c.draggable=true; c.tabIndex=0; c.setAttribute("role","listitem");
  c.appendChild(el("div","tt"));
  c.appendChild(el("div","ft"));
  c.addEventListener("dragstart",e=>{ S.ui.dragId=t.id; S.ui.dragging=true; c.classList.add("drag");
    e.dataTransfer.effectAllowed="move"; });
  c.addEventListener("dragend",()=>{ c.classList.remove("drag"); S.ui.dragging=false; });
  c.addEventListener("keydown",e=>{
    if (e.key==="["||e.key==="]"){
      e.preventDefault();
      const i=COLS.indexOf(t.status), n=COLS[i+(e.key==="]"?1:-1)];
      if (n){ moveTask(t.id,n); announce("moved to "+n); }
    }
  });
  return c;
}
function patchCard(c,t){
  c.className="card s-"+t.status;
  c.querySelector(".tt").textContent=t.title;
  c.title=t.detail||t.title;
  const f=c.querySelector(".ft"); while (f.firstChild) f.removeChild(f.firstChild);
  if (t.assignee){ const a=avatar(t.assignee,16,agentOf(t.assignee)); f.appendChild(a);
    const n=el("span","nm",t.assignee); n.style.setProperty("--who",hue(t.assignee)); f.appendChild(n); }
  else f.appendChild(el("span","un","unclaimed"));
  f.appendChild(el("span","id","#"+t.id));
}
async function moveTask(id, status){
  const d=pd(S.sel), t=d.tasks.get(id);
  if (!t || t.status===status) return;
  const prev=t.status; t.status=status; paintBoard(); paintHeader();
  const r=await api("/api/task",{id,status});
  if (!r || r.error){
    t.status=prev; paintBoard();
    const c=$("board").querySelector('[data-k="t'+id+'"]');
    if (c){ c.classList.add("revert"); setTimeout(()=>c.classList.remove("revert"),2000); }
    toast("Could not move #"+id,{bad:true,action:"Retry",onAction:()=>moveTask(id,status)});
  } else scheduleFetch(true);
}
function startAddTask(){
  if (!S.sel) return;
  if (S.view!=="board") setView("board");
  const col=$("board").querySelector('.col[data-status="todo"]');
  const ar=col.querySelector(".addrow"); if (ar) ar.classList.add("hidden");
  if (col.querySelector(".addform")) { col.querySelector(".addform input").focus(); return; }
  const f=el("div","addform");
  const i=el("input"); i.placeholder="Task title"; f.appendChild(i);
  const rw=el("div","rw");
  const who=el("button","btn sec","unclaimed"); let assignee="";
  who.addEventListener("click",()=>openPop(who,(p,close)=>{
    popItem(p,"unclaimed",{onClick:()=>{assignee="";who.textContent="unclaimed";close();}});
    for (const a of AGENTS) popItem(p,a,{avatar:a,hue:hue(a),onClick:()=>{assignee=a;who.textContent=a;close();}});
  },{up:true}));
  rw.appendChild(who);
  const sp=el("span"); sp.style.flex="1"; rw.appendChild(sp);
  const cancel=el("button","btn sec","Cancel");
  const add=el("button","btn","Add");
  rw.appendChild(cancel); rw.appendChild(add); f.appendChild(rw);
  const done=()=>{ unregisterEditor(done); f.remove(); if (ar) ar.classList.remove("hidden"); };
  registerEditor(done);
  cancel.addEventListener("click",done);
  const submit=async()=>{
    const title=i.value.trim(); if (!title) return done();
    i.value=""; i.focus();
    await createTask(title, assignee);
  };
  add.addEventListener("click",submit);
  i.addEventListener("keydown",e=>{ if (e.key==="Enter"){ e.preventDefault(); submit(); }
    if (e.key==="Escape"){ e.preventDefault(); done(); } });
  col.insertBefore(f, ar||null);
  i.focus();
}
async function createTask(title, assignee){
  const d=pd(S.sel);
  const ghost={id:-Date.now(), title, assignee:assignee||"", status:"todo", detail:"",
               created_by:"user", updated_at:new Date().toISOString(), ghost:true};
  d.tasks.set(ghost.id,ghost); paintBoard();
  const r=await api("/api/task",{slug:S.sel,title,assignee:assignee||""});
  d.tasks.delete(ghost.id);
  if (!r||r.error){ paintBoard(); toast("Could not create task",{bad:true}); }
  else scheduleFetch(true);
}
function openTask(id){
  if (!S.sel) return;
  setView("board");
  requestAnimationFrame(()=>{
    const c=$("board").querySelector('[data-k="t'+id+'"]');
    if (c){ c.scrollIntoView({block:"center"}); c.classList.add("flashrow");
      setTimeout(()=>c.classList.remove("flashrow"),900); }
    else toast("#"+id+" is not on this board");
  });
}
/* ============================================================ 12. INSPECTOR */
function isec(key, title, build){
  const open=ls.get("tp.insp.sec."+key,true);
  const s=el("div","isec"+(open?"":" closed")); s.dataset.sec=key;
  const h=el("h4"); h.appendChild(icon("i-chevron-d","ic-sm")); h.appendChild(el("span",null,title));
  const b=el("div","ic-body");
  h.addEventListener("click",()=>{ s.classList.toggle("closed");
    ls.set("tp.insp.sec."+key,!s.classList.contains("closed")); });
  s.appendChild(h); s.appendChild(b);
  build(b);
  return s;
}
function paintInspector(){
  const host=$("inspector");
  host.classList.toggle("hidden", !S.insp.open || !S.sel);
  if (!S.insp.open || !S.sel) return;
  const d=pd(S.sel), p=d.project; if (!p) return;
  const fp=[p.updated_at,p.summary.length,p.workdir,d.tasks.size,d.cursors.length,
            (d.git.worktrees||[]).map(w=>w.branch+w.ahead+w.behind+w.dirty).join("|"),
            S.ui.editing].join(":");
  if (host.dataset.fp===fp) return;
  if (S.ui.editing) return;
  host.dataset.fp=fp;
  resetList(host);
  /* 1 summary */
  host.appendChild(isec("summary","Summary",b=>{
    if (!p.summary){ b.appendChild(el("div","em","No summary yet. Agents keep this current after milestones.")); return; }
    const fake={id:"sum:"+S.sel+":"+p.summary.length, body:p.summary, author:"agents", kind:"note"};
    const w=formatBody(fake,{tasks:d.tasks, tv:tasksVer(S.sel), clampAt:6});
    w.style.fontSize="13px"; b.appendChild(w);
  }));
  /* 2 progress */
  const tasks=[...d.tasks.values()].filter(t=>t.status!=="dropped");
  const done=tasks.filter(t=>t.status==="done").length;
  host.appendChild(isec("progress","Progress",b=>{
    b.appendChild(el("div","big",done+" of "+tasks.length+" done"));
    const tr=el("div","track"); const fill=el("div");
    fill.style.width=(tasks.length?Math.round(done/tasks.length*100):0)+"%"; tr.appendChild(fill);
    b.appendChild(tr);
    const m=el("div","micro");
    for (const st of COLS){
      const n=tasks.filter(t=>t.status===st).length;
      const s=el("span"); const dot=el("span","sd"); dot.style.cssText="width:6px;height:6px;border-radius:50%;background:"+
        (st==="done"?"var(--ok)":st==="doing"?"var(--accent)":st==="blocked"?"var(--danger)":"var(--tx-4)");
      s.appendChild(dot); s.appendChild(document.createTextNode(n+" "+st)); m.appendChild(s);
    }
    b.appendChild(m);
  }));
  /* 3 worktrees */
  host.appendChild(isec("worktrees","Worktrees",b=>{
    if (!d.git || !d.git.is_git){
      b.appendChild(el("div","em","Not a git repository"));
      b.appendChild(el("div","em",p.workdir||"(no workdir set)"));
      const a=el("button","btn sec","Edit workdir");
      a.addEventListener("click",()=>{ const w=host.querySelector('[data-sec="workdir"]');
        if (w){ w.classList.remove("closed"); w.scrollIntoView({block:"nearest"});
          const pen=w.querySelector(".pen"); if (pen) pen.click(); } });
      b.appendChild(a); return;
    }
    for (const w of d.git.worktrees||[]){
      const r=el("div","wt");
      const b1=el("div","b1");
      const br=el("span","br",w.branch||"(detached)");
      const own=/agent\/(\w+)\//.exec(w.branch||"");
      if (own && IDENTITY[own[1]]) br.style.setProperty("--who",hue(own[1]));
      b1.appendChild(br);
      if (w.ahead){ const s=el("span","ah","+"+w.ahead); s.title=w.ahead+" commits ahead of the default branch"; b1.appendChild(s); }
      if (w.behind){ const s=el("span","bh","-"+w.behind); s.title=w.behind+" commits behind the default branch"; b1.appendChild(s); }
      if (w.dirty){ const s=el("span","dy","●"+w.dirty); s.title=w.dirty+" uncommitted changes"; b1.appendChild(s); }
      r.appendChild(b1);
      const pth=el("div","pth",w.path); pth.title=w.path+" (click copies)";
      pth.addEventListener("click",()=>copy(w.path,pth));
      r.appendChild(pth); b.appendChild(r);
    }
  }));
  /* 4 cursors */
  host.appendChild(isec("cursors","Read cursors",b=>{
    const last=d.order.length?d.order[d.order.length-1]:0;
    const rows=d.cursors.filter(c=>c.agent!=="user");
    if (!rows.length){ b.appendChild(el("div","em","No agent has read this project yet.")); return; }
    for (const c of rows){
      const r=el("div","crow");
      r.appendChild(avatar(c.agent,20,agentOf(c.agent)));
      const n=el("span","nm",c.agent); n.style.setProperty("--who",hue(c.agent)); r.appendChild(n);
      const behind=d.order.filter(id=>id>c.last_msg_id).length;
      const st=el("span","st"+(behind?"":" ok"), behind?behind+" behind":"caught up");
      r.appendChild(st);
      if (AGENTS.includes(c.agent)){
        const s=el("button","gb"); s.appendChild(icon("i-bolt","ic-sm")); s.title="Summon here";
        s.addEventListener("click",()=>summon(c.agent)); r.appendChild(s);
      }
      b.appendChild(r);
    }
  }));
  /* 5 workdir */
  host.appendChild(isec("workdir","Workdir",b=>{
    const chip=el("div","wdchip");
    const path=el("span","p",p.workdir||"(not set)"); chip.appendChild(path);
    const cp=el("button","gb"); cp.appendChild(icon("i-copy","ic-sm")); cp.title="Copy";
    cp.addEventListener("click",()=>copy(p.workdir||"",chip)); chip.appendChild(cp);
    const pen=el("button","gb pen"); pen.appendChild(icon("i-pencil","ic-sm")); pen.title="Edit";
    chip.appendChild(pen);
    pen.addEventListener("click",()=>{
      /* the write must land on the project whose path is on screen, never on
         whatever happens to be selected when the request finally goes out */
      const slug=S.sel;
      const inp=el("input"); inp.value=p.workdir||""; chip.replaceChild(inp,path);
      cp.classList.add("hidden"); pen.classList.add("hidden");
      const ok=el("button","gb"); ok.appendChild(icon("i-check","ic-sm"));
      const no=el("button","gb"); no.appendChild(icon("i-x","ic-sm"));
      chip.appendChild(ok); chip.appendChild(no);
      const stop=()=>{ unregisterEditor(stop); host.dataset.fp=""; paintInspector(); };
      registerEditor(stop);
      no.addEventListener("click",stop);
      const save=async()=>{
        const v=inp.value.trim(); const old=p.workdir; p.workdir=v;
        unregisterEditor(stop); host.dataset.fp=""; paintInspector();
        const w=host.querySelector(".wdchip"); if (w){ w.classList.add("flash-ok"); setTimeout(()=>w.classList.remove("flash-ok"),600); }
        const r=await api("/api/workdir",{slug,workdir:v});
        if (!r||r.error){ p.workdir=old; host.dataset.fp=""; paintInspector(); toast("Could not save workdir",{bad:true}); }
        else scheduleFetch(true);
      };
      ok.addEventListener("click",save);
      inp.addEventListener("keydown",e=>{ if (e.key==="Enter"){e.preventDefault();save();}

  const src = S.sel ? pd(S.sel).order.map(i=>pd(S.sel).messages.get(i)) : S.activity;

function markIn(root,q,hits){
  const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{
    acceptNode:n=> n.parentElement.closest("pre")?NodeFilter.FILTER_REJECT
      : n.nodeValue.toLowerCase().indexOf(q)>=0?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP});
  const targets=[]; let n; while ((n=walk.nextNode())) targets.push(n);
  for (const t of targets){
    const txt=t.nodeValue; const low=txt.toLowerCase();
    const frag=document.createDocumentFragment(); let i=0,k;
    while ((k=low.indexOf(q,i))>=0){
      if (k>i) frag.appendChild(document.createTextNode(txt.slice(i,k)));
      const mk=el("mark",null,txt.slice(k,k+q.length)); frag.appendChild(mk); hits.push(mk);
      i=k+q.length;
    }
    if (i<txt.length) frag.appendChild(document.createTextNode(txt.slice(i)));
    t.parentNode.replaceChild(frag,t);
  }
}

function fuzzy(q, s){
  q=q.toLowerCase(); s=s.toLowerCase();
  if (!q) return {score:0, idx:[]};
  let i=0, idx=[], gaps=0, wb=0, last=-2;
  for (let j=0;j<s.length && i<q.length;j++){
    if (s[j]===q[i]){ idx.push(j); if (j!==last+1) gaps++;
      if (j===0||/[^a-z0-9]/.test(s[j-1])) wb++; last=j; i++; }
  }
  if (i<q.length) return null;
  return {score: -idx[0]*2 - gaps + wb*3, idx};
}
/* Source rank is part of the contract: projects -> commands -> tasks -> agents.
   The fuzzy score only orders within a source band. */
const PAL_RANK={Projects:24, Commands:12, Tasks:0, Agents:-6};
function palSources(q){
  const out=[];
  const add=(g,o)=>{ o.g=g; o.score+=PAL_RANK[g]; out.push(o); };
  for (const p of S.projects){
    const fs=fuzzy(q,p.slug), fn=fuzzy(q,p.name||""), f=fs||fn;
    if (f) add("Projects",{label:p.slug, right:p.msg_count+" msgs", idx:fs?fs.idx:[],
      score:f.score, run:()=>selectProject(p.slug), avatar:p.slug});
  }
  for (const c of commands()){
    const f=fuzzy(q,c.label);
    if (f) add("Commands",{label:c.label, idx:f.idx, score:f.score, run:c.run, icon:c.icon});
  }
  if (S.sel) for (const t of pd(S.sel).tasks.values()){
    const f=fuzzy(q,"#"+t.id+" "+t.title);
    if (f) add("Tasks",{label:"#"+t.id+" "+t.title, right:t.status, idx:f.idx, score:f.score,
      run:()=>openTask(t.id)});
  }
  if (S.sel) for (const a of AGENTS){
    const f=fuzzy(q,a);
    if (f) add("Agents",{label:"Summon "+a, idx:[], score:f.score, run:()=>summon(a), avatar:a});
  }
  out.sort((a,b)=>b.score-a.score);
  return out.slice(0,40);
}

  S.activity=ms;
  S.ui.eager=new Set(ms.map(m=>m.id));   /* the endpoint is capped at 40; format them all */
  if (S.sel===null && S.globalView==="activity" && S.ver_act!==v){ S.ver_act=v; paintTimeline(); }
}
const refetch={};
async function fetchProject(slug, force){
  /* at most one request per slug in flight; a request that arrives while one is
     open is deferred, never dropped (dropping it left the channel on skeletons) */
  if (inflight[slug]){ refetch[slug]=refetch[slug]||force; return; }
  inflight[slug]=true;
  const d=await api("/api/project?slug="+encodeURIComponent(slug));
  inflight[slug]=false;
  if (refetch[slug]){ refetch[slug]=false; setTimeout(()=>fetchProject(slug,true),0); }
  if (!d || d.error){ netFail(); return; }
  markClean();
  S.now=d.now||S.now;
  const st=pd(slug);
  st.project=d.project;
  st.capped=d.messages.length>=300;
  const vm=d.messages.length+":"+(d.messages.length?d.messages[d.messages.length-1].id:0);
  const vt=d.tasks.length+":"+d.tasks.map(t=>t.updated_at).sort().pop();
  const vg=((d.git.commits||[])[0]||{}).hash+":"+(d.git.worktrees||[]).length+":"
    +(d.git.worktrees||[]).map(w=>w.branch+w.ahead+w.behind+w.dirty).join("|");
  const vp=d.project.updated_at+":"+d.project.summary.length+":"+d.project.workdir;
  const changed={};
  if (st.ver.m!==vm || force){
    st.ver.m=vm;
    /* drop optimistic rows the server has now confirmed */
    const real=new Set(d.messages.map(m=>m.id));
    for (const [k,m] of [...st.messages]) if (m.optimistic){
      const match=d.messages.find(x=>x.author==="user"&&x.kind===m.kind&&x.body===m.body);
      if (match){ st.messages.delete(k); st.order=st.order.filter(x=>x!==k); }
    }
    for (const m of d.messages) if (!st.messages.has(m.id)){ st.messages.set(m.id,m); }
    const opt=st.order.filter(id=>typeof id==="string");
    st.order=d.messages.map(m=>m.id).concat(opt);
    changed.m=true;
  }
  if (st.ver.t!==vt || force){ st.ver.t=vt; st.tasks=new Map(d.tasks.map(t=>[t.id,t])); changed.t=true; }
  if (st.ver.g!==vg || force){ st.ver.g=vg; st.git=d.git||{}; changed.g=true; }
  if (st.ver.p!==vp || force){ st.ver.p=vp; changed.p=true; }
  st.cursors=d.cursors||[];
  S.agents=d.agents||S.agents;
  if (slug!==S.sel) return;
  if (S.ui.firstPaint || changed.m){
    /* eager-format the newest 40 */
    S.ui.eager=new Set(st.order.slice(-40));
    pinUnread(st);
  }
  if (changed.m||changed.g||force) { if (S.view==="activity") paintTimeline(); }
  if (changed.t||force){ if (S.view==="board") paintBoard(); paintHeader(); }
  if (changed.p||changed.t||changed.g||force) paintInspector();
  if (changed.p) paintHeader();
  S.ui.firstPaint=false;
}
function netFail(){
  S.down=true;
  clearTimeout(S.reconTimer);
  S.reconTimer=setTimeout(()=>{ if (S.down) $("recon").classList.remove("hidden"); },5000);
  setConn("dead");
}
function setConn(state){
  const c=$("conn"); c.className=state==="live"?"live":state;
  c.title=state==="live"?"live updates connected"
    :state==="poll"?"live updates lost, polling every 10s":"cannot reach the monitor";
}
let es=null;
/* ?nolive forces the documented degraded path (poll only, no event stream). The
   app already has to survive a dead stream; this makes that state reachable for
   capture and for hosts where EventSource is unavailable. */
const NOLIVE=/[?&]nolive\b/.test(location.search);
function connect(){
  if (NOLIVE){ setConn("poll"); return; }
  try{ if (es) es.close(); }catch(e){}
  es=new EventSource("/api/events");
  es.onopen=()=>{ setConn("live"); markClean(); };
  es.onmessage=()=>{ dirty=true; if (!rafId) rafId=requestAnimationFrame(flush); };
  es.onerror=()=>{ setConn("poll"); };
}
function reconnect(){ connect(); scheduleFetch(true); }
function flush(){
  rafId=0;
  if (!dirty) return;
  if (S.ui.dragging || S.ui.popover || S.ui.editing){ rafId=requestAnimationFrame(flush); return; }
  dirty=false;
  scheduleFetch(true);
}
/* ============================================================ 19. KEYBOARD */
function inField(e){
  const t=e.target;
  return t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable);
}
let gPending=false;
function onKey(e){
  const k=e.key;
  if (e.ctrlKey && !e.altKey){
    if (k==="k"||k==="K"){ e.preventDefault(); return openPalette(); }
    if (k==="b"||k==="B"){ e.preventDefault(); return toggleSidebar(); }
    if (k==="."){ e.preventDefault(); return toggleInspector(); }
    if (k==="f"||k==="F"){ e.preventDefault(); return S.sel||S.activity.length?openFind():null; }
    if (e.shiftKey && (k==="n"||k==="N")){ e.preventDefault(); return newProjectModal(); }
    if (k>="1"&&k<="9"){ e.preventDefault(); const p=S.projects[+k-1]; if (p) selectProject(p.slug); return; }
    if (k==="Enter"){ if (e.target===$("c-body")){ e.preventDefault(); post(); } return; }
  }
  if (e.altKey){
    if (k==="ArrowDown"||k==="ArrowUp"){
      e.preventDefault();
      const list=e.shiftKey?S.projects.filter(p=>{const a=attnFor(p.slug); return a&&a.last_msg_id>readMark(p.slug);}):S.projects;
      if (!list.length) return;
      const i=list.findIndex(p=>p.slug===S.sel);
      const n=list[(i+(k==="ArrowDown"?1:-1)+list.length)%list.length];
      if (n) selectProject(n.slug);
      return;
    }
  }
  if (k==="Escape"){
    if (S.ui.popover) return closePop();
    if (modalEl) return closeModal();
    if (S.ui.find) return closeFind();
    if (inField(e)){ e.target.blur(); return; }
    if (S.sel){ const d=pd(S.sel); const last=d.order.filter(i=>typeof i==="number").pop();
      if (last) { setReadMark(S.sel,last); paintSidebar(); } }
    return;
  }
  if (inField(e)) return;
  if (k==="?"){ e.preventDefault(); return shortcutSheet(); }
  if (k==="/"){ e.preventDefault(); if (S.sel){ setView("activity"); $("c-body").focus(); } return; }
  if (k==="g"){ gPending=true; setTimeout(()=>gPending=false,900); return; }
  if (gPending && (k==="a"||k==="b")){ gPending=false; if (S.sel) setView(k==="a"?"activity":"board"); return; }
  if (k==="f"){ e.preventDefault(); return filterPop($("b-filter")); }
  if (k==="s"){ e.preventDefault(); return summonPop($("b-summon-menu")); }
  if (k==="t"){ e.preventDefault(); return startAddTask(); }
  if (k==="j"||k==="k"){ e.preventDefault(); return moveRowFocus(k==="j"?1:-1); }
  if (k==="o"){ const r=focusedRow(); if (r&&r.dataset.msg){ e.preventDefault(); toggleExpand(+r.dataset.msg);} return; }
  if (k==="c"){ const r=focusedRow(); if (r&&r.dataset.msg){ e.preventDefault(); copy("#"+r.dataset.msg);} return; }
  if (k==="Home"){ e.preventDefault(); $("scroller").scrollTop=0; return; }
  if (k==="End"){ e.preventDefault(); $("scroller").scrollTop=$("scroller").scrollHeight; return; }
}
function focusedRow(){ return S.ui.rowFocus && S.ui.rowFocus.isConnected ? S.ui.rowFocus : null; }
function moveRowFocus(dir){
  const rows=[...$("timeline").querySelectorAll(".row,.sys")];
  if (!rows.length) return;
  let i=rows.indexOf(focusedRow());
  i=Math.max(0,Math.min(rows.length-1, i<0?(dir>0?0:rows.length-1):i+dir));
  const r=rows[i];
  if (S.ui.rowFocus) S.ui.rowFocus.style.outline="";
  S.ui.rowFocus=r; r.style.outline="2px solid var(--accent-line)"; r.style.outlineOffset="-2px";
  r.scrollIntoView({block:"nearest"});
  if (r.dataset.msg){ const m=lookupMsg(r.dataset.msg); if (m) announce(m.author+" "+m.kind); }
}
/* One owner for every width-driven sidebar decision. The rail is ONLY the
   [720,940) band: below 720 the sidebar is a 260px drawer with real labels, and
   a drawer that covers the timeline must start closed. */
function applyResponsive(){
  const w=innerWidth, sb=$("sidebar");
  sb.classList.toggle("rail", w<940 && w>=720);
  const small=w<720;
  if (small!==S.ui.sbSmall){ S.ui.sbSmall=small; S.ui.sbAway=small; }
  sb.classList.toggle("away", S.ui.sbAway);
  sb.classList.toggle("hidden", S.ui.sbAway && !small);
}
function toggleSidebar(){ S.ui.sbAway=!S.ui.sbAway; applyResponsive(); }
function toggleInspector(){
  if (!S.sel) return;
  S.insp.open=!S.insp.open; ls.set("tp.insp."+S.sel,S.insp.open);
  $("inspector").dataset.fp=""; paintInspector(); paintHeader();
}
/* ============================================================ 20. BOOT */
function wire(){
  buildActs();
  $("wm").addEventListener("click",()=>goGlobal("activity"));
  $("nav-activity").addEventListener("click",()=>goGlobal("activity"));
  $("nav-needs").addEventListener("click",()=>goGlobal("needs"));
  $("b-search").addEventListener("click",openPalette);
  $("b-newproj").addEventListener("click",newProjectModal);
  $("b-filter").addEventListener("click",e=>filterPop(e.currentTarget));
  $("b-summon").addEventListener("click",()=>summon(AGENTS[0]));
  $("b-summon-menu").addEventListener("click",e=>summonPop(e.currentTarget));
  $("b-insp").addEventListener("click",toggleInspector);
  $("presence").addEventListener("click",e=>presencePop(e.currentTarget));
  $("b-menu").addEventListener("click",e=>openPop(e.currentTarget,(p,close)=>{
    popItem(p,"Theme",{right:document.documentElement.getAttribute("data-theme"),onClick:()=>{toggleTheme();close();}});
    popItem(p,"Keyboard shortcuts",{onClick:()=>{close();shortcutSheet();}});
    popItem(p,"About",{sub:"Turnpike Deck",onClick:()=>{close();toast("Turnpike Deck · local bus monitor");}});
  },{up:true,right:true}));
  document.querySelectorAll(".sec-head").forEach(h=>h.addEventListener("click",()=>{
    const k="tp.sec."+h.dataset.sec; ls.set(k,!ls.get(k,h.dataset.sec==="projects")); paintSidebar(); }));
  document.querySelectorAll("#h-segs .seg").forEach(s=>s.addEventListener("click",()=>setView(s.dataset.view)));
  $("h-topic").addEventListener("click",()=>{ if (S.sel && !S.insp.open) toggleInspector(); });
  $("c-kind").addEventListener("click",e=>kindPop(e.currentTarget));
  $("c-send").addEventListener("click",post);
  $("c-body").addEventListener("input",()=>{ autoGrow(); saveDraft(); paintSidebar(); });
  $("c-body").addEventListener("keydown",e=>{ if (e.key==="Enter"&&e.ctrlKey){ e.preventDefault(); post(); } });
  $("jump").addEventListener("click",()=>{ const sc=$("scroller"); sc.scrollTop=sc.scrollHeight; });
  $("b-retry").addEventListener("click",reconnect);
  $("find-in").addEventListener("input",()=>{ clearTimeout(S.findT); S.findT=setTimeout(runFind,140); });
  $("find-in").addEventListener("keydown",e=>{
    if (e.key==="Enter"){ e.preventDefault(); if (S.ui.find&&S.ui.find.hits.length) focusHit(S.ui.find.i+(e.shiftKey?-1:1)); }
    if (e.key==="Escape"){ e.preventDefault(); closeFind(); } });
  $("find-next").addEventListener("click",()=>S.ui.find&&focusHit(S.ui.find.i+1));
  $("find-prev").addEventListener("click",()=>S.ui.find&&focusHit(S.ui.find.i-1));
  $("find-close").addEventListener("click",closeFind);
  $("scrim").addEventListener("click",closeModal);
  $("timeline").addEventListener("mouseover",e=>{
    const r=e.target.closest(".row"); if (r && r.dataset.msg) attachActs(r); });
  $("b-ham").addEventListener("click",toggleSidebar);
  document.addEventListener("keydown",onKey);
  window.addEventListener("resize",()=>{ paintHeader(); applyResponsive(); });
  applyResponsive();
  /* read-mark advance: within 80px of the bottom for 600ms */
  let bt=0;
  $("scroller").addEventListener("scroll",()=>{
    const sc=$("scroller");
    const near=sc.scrollHeight-sc.scrollTop-sc.clientHeight<80;
    clearTimeout(bt);
    if (near && S.sel){ bt=setTimeout(()=>{ const d=pd(S.sel);
      const last=d.order.filter(i=>typeof i==="number").pop();
      if (last && last>readMark(S.sel)){ setReadMark(S.sel,last); paintSidebar(); } },600); }
    if (!S.dayRaf) S.dayRaf=requestAnimationFrame(()=>{ S.dayRaf=0; updateDays(); });
    if (!near) return;
    $("jump").style.display="none";
  },{passive:true});
}
function boot(){
  document.documentElement.setAttribute("data-theme", ls.get("tp.theme","dark"));
  wire();
  setConn("poll");
  skeleton();
  connect();
  loadProjects().then(()=>{
    const hash=decodeURIComponent(location.hash.replace(/^#\/?/,""));
    const last=hash||ls.get("tp.last",null);
    if (last && S.projects.some(p=>p.slug===last)) selectProject(last);
    else goGlobal("activity");
  });
  window.addEventListener("hashchange",()=>{
    const h=decodeURIComponent(location.hash.replace(/^#\/?/,""));
    if (h && h!==S.sel && S.projects.some(p=>p.slug===h)) selectProject(h);
  });
  setInterval(()=>{ if (!document.hidden) { loadProjects(); if (S.sel) fetchProject(S.sel); else loadActivity(); } },10000);
  setInterval(()=>{ document.querySelectorAll("[data-ts]").forEach(n=>{ n.textContent=fmtTs(n.dataset.ts); }); },30000);
}
boot();
