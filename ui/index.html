<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Turnpike</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============================================================ 2. TOKENS */
:root{
  --bg-app:#0b0d11; --bg-sidebar:#101319; --bg-canvas:#161a21; --bg-raised:#1b1f27;
  --bg-hover:#1c212a; --bg-hover-sb:#171b23; --bg-active:#222833; --bg-sunken:#12151b;
  --bg-scrim:rgba(8,10,14,.62);

  --line-hair:rgba(255,255,255,.055); --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.15); --line-accent:#3d6ea8;

  --tx-hi:#f4f6fa; --tx:#d5dae3; --tx-2:#a7aebb; --tx-3:#7d8695; --tx-4:#5c6473;

  --accent:#6ea8fe; --accent-solid:#2f6df6; --accent-solid-h:#3f7bff;
  --accent-solid-a:#2a62dd; --accent-wash:rgba(110,168,254,.13);
  --accent-line:rgba(110,168,254,.35);
  --ok:#3fb950; --ok-tint:rgba(63,185,80,.14);
  --warn:#d1a418; --warn-tint:rgba(209,164,24,.13);
  --danger:#e5534b; --danger-tint:rgba(229,83,75,.14);

  --claude:#d97757; --codex:#74c69d; --deepseek:#9d7cfe; --user:#6ea8fe;
  --claude-tint:rgba(217,119,87,.18); --codex-tint:rgba(116,198,157,.18);
  --deepseek-tint:rgba(157,124,254,.18); --user-tint:rgba(110,168,254,.18);
  --p0:#6ea8fe; --p1:#74c69d; --p2:#d97757; --p3:#9d7cfe;
  --p4:#d1a418; --p5:#4fb3bf; --p6:#e08bb8; --p7:#8fa4c9;

  --k-directive:#6ea8fe; --k-directive-bg:rgba(110,168,254,.14);
  --k-blocker:#e5534b;   --k-blocker-bg:rgba(229,83,75,.14);
  --k-question:#d1a418;  --k-question-bg:rgba(209,164,24,.13);
  --k-decision:#d1a418;  --k-decision-bg:transparent;
  --k-neutral:#7d8695;   --k-neutral-bg:rgba(255,255,255,.06);

  --tone-danger:#e5534b; --tone-warn:#d1a418; --tone-ok:#3fb950;
  --tone-neutral:rgba(255,255,255,.15);

  --f-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-disp:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --f-mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;

  --t-display:600 20px/26px var(--f-disp);
  --t-title:600 16px/22px var(--f-ui);
  --t-lede:600 15px/22px var(--f-ui);
  --t-body:400 15px/22px var(--f-ui);
  --t-ui:450 14px/20px var(--f-ui);
  --t-sm:400 13px/19px var(--f-ui);
  --t-meta:400 12px/16px var(--f-ui);
  --t-label:650 11px/14px var(--f-ui);
  --t-mono:400 12.5px/20px var(--f-mono);
  --t-mono-in:500 12px/16px var(--f-mono);
  --tracking-label:.055em; --tracking-title:-.006em;

  --s1:2px; --s2:4px; --s3:6px; --s4:8px; --s5:12px; --s6:16px;
  --s7:20px; --s8:24px; --s9:32px; --s10:40px; --s11:48px;
  --r-chip:4px; --r-ctl:6px; --r-card:8px; --r-panel:10px; --r-modal:12px; --r-pill:999px;

  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 4px 14px -3px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.05);
  --sh-3:0 18px 52px -14px rgba(0,0,0,.72), 0 0 0 1px rgba(255,255,255,.07);
  --sh-inset-top:inset 0 1px 0 rgba(255,255,255,.045);
  --ring:0 0 0 2px var(--bg-canvas), 0 0 0 4px rgba(110,168,254,.55);

  --d-fast:90ms; --d-ui:140ms; --d-panel:200ms; --d-enter:280ms; --d-flash:900ms;
  --e-out:cubic-bezier(.2,.7,.3,1); --e-in:cubic-bezier(.4,0,1,1);
  --e-spring:cubic-bezier(.16,1,.3,1);

  /* 76ch at 15px Segoe. Expressed in px on purpose: `ch` resolves against the
     USING element's own font, so 76ch is 632.9px on the 600-weight lede, 614.5px
     on 400-weight prose and 491.6px on a 12px control. A ruler that changes width
     per element is not a ruler - §1.1 wants one, and this is its single owner. */
  --gutter:36px; --gap:12px; --pad-x:24px; --origin:72px; --measure:630px;
  --row-proj:34px; --row-nav:30px; --row-sys:26px; --row-sec:32px;
  --sb-w:260px;

  --z-day:10; --z-hover:20; --z-header:30; --z-pop:40;
  --z-drawer:50; --z-toast:60; --z-modal:70;
}
[data-theme="light"]{
  --bg-app:#e8eaee; --bg-sidebar:#f0f1f4; --bg-canvas:#ffffff; --bg-raised:#ffffff;
  --bg-hover:#f5f6f8; --bg-hover-sb:#e9ebef; --bg-active:#e2e5ea; --bg-sunken:#f4f5f7;
  --bg-scrim:rgba(16,20,28,.35);
  --line-hair:rgba(0,0,0,.07); --line:rgba(0,0,0,.12); --line-strong:rgba(0,0,0,.18);
  --tx-hi:#12151a; --tx:#1b1e24; --tx-2:#4a5160; --tx-3:#6b7280; --tx-4:#8b93a1;
  --claude:#b6532f; --codex:#2f8f63; --deepseek:#6c45d8; --user:#1a6ad4;
  --sh-1:0 1px 2px rgba(16,20,28,.10);
  --sh-2:0 4px 14px -3px rgba(16,20,28,.14), 0 0 0 1px rgba(0,0,0,.05);
  --sh-3:0 18px 52px -14px rgba(16,20,28,.20), 0 0 0 1px rgba(0,0,0,.06);
  --ring:0 0 0 2px var(--bg-canvas), 0 0 0 4px rgba(47,109,246,.45);
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}
  .row-enter{transform:none!important}
}

/* ============================================================ globals */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:var(--t-ui);background:var(--bg-canvas);color:var(--tx);
     display:flex;overflow:hidden;font-synthesis:none}
.ts,.count,.num,.mono,.hash{font-variant-numeric:tabular-nums}
::selection{background:rgba(110,168,254,.30);color:var(--tx-hi)}
:where(a,button,[tabindex],input,textarea,select,[role=button]):focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-ctl)}
*{scrollbar-width:thin;scrollbar-color:transparent transparent}
*:hover{scrollbar-color:#39414f transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:transparent;border:3px solid transparent;
  background-clip:padding-box;border-radius:5px}
:hover::-webkit-scrollbar-thumb{background:#39414f;background-clip:padding-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:8px;z-index:var(--z-modal);background:var(--bg-raised);
      color:var(--tx-hi);padding:8px 14px;border-radius:var(--r-ctl);box-shadow:var(--sh-2)}
.skip:focus{left:8px}
.hidden{display:none!important}

/* icons */
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.25;
    stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic-sm{width:14px;height:14px;stroke-width:1.35}
.ic-lg{width:20px;height:20px;stroke-width:1.15}
.ic.fill,.ic.fill *{fill:currentColor;stroke:none}

/* generic ghost button */
.gb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;
    min-width:28px;padding:0 6px;border-radius:var(--r-ctl);color:var(--tx-3);
    transition:background var(--d-fast) linear,color var(--d-fast) linear}
.gb:hover{background:var(--bg-hover);color:var(--tx)}
.gb.on{color:var(--accent)}
.gb[disabled]{color:var(--tx-4);cursor:default;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;
     padding:0 12px;border-radius:var(--r-ctl);font:var(--t-ui);font-weight:600;
     background:var(--accent-solid);color:#fff;transition:background var(--d-fast) linear}
.btn:hover{background:var(--accent-solid-h)}
.btn:active{background:var(--accent-solid-a)}
.btn[disabled]{background:var(--bg-active);color:var(--tx-4);cursor:default}
.btn.sec{background:var(--bg-active);color:var(--tx-2);font-weight:450}
.btn.sec:hover{background:var(--bg-hover)}

/* avatars */
.av{width:var(--av,36px);height:var(--av,36px);border-radius:var(--r-card);flex:none;
    display:grid;place-items:center;user-select:none;position:relative;
    background:color-mix(in srgb, var(--who) 18%, var(--bg-canvas));
    color:color-mix(in srgb, var(--who) 88%, #fff);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);font-weight:700;
    font-size:calc(var(--av,36px) * .39);line-height:1}
.av.act{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 0 0 1.5px color-mix(in srgb,var(--who) 55%,transparent)}
.av .pres{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;
    box-shadow:0 0 0 2px var(--surf,var(--bg-canvas))}
.pres.p-now{background:var(--ok)}
.pres.p-recent{background:transparent;border:2px solid var(--ok)}
.pres.p-day{background:var(--tx-4)}
.pres.p-old{background:transparent;border:2px solid var(--tx-4)}
.who-c{color:var(--who);font-weight:650}

/* ============================================================ 4.2 SIDEBAR */
#sidebar{width:var(--sb-w);min-width:var(--sb-w);background:var(--bg-sidebar);
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:2}
#brand{height:48px;flex:none;display:flex;align-items:center;padding:0 12px 0 16px;gap:0}
#brand .wm{font:var(--t-title);color:var(--tx-hi);letter-spacing:var(--tracking-title);
  cursor:pointer;background:none}
/* the 24px mark is the rail's brand. It was carrying an INLINE display:none,
   which no stylesheet rule can ever win against, so the rail had no brand at all. */
#brand .mk{display:none;width:24px;height:24px;stroke-width:1.15}
#conn{width:6px;height:6px;border-radius:50%;margin-left:8px;background:var(--ok);flex:none}
#conn.live{animation:breathe 2.4s ease-in-out infinite}
#conn.poll{background:var(--warn)} #conn.dead{background:var(--danger)}
@keyframes breathe{0%{box-shadow:0 0 0 0 rgba(63,185,80,.45)}70%{box-shadow:0 0 0 5px transparent}100%{box-shadow:0 0 0 0 transparent}}
#brand .sp{flex:1}
#nav{padding:4px 0 2px}
.nav{height:var(--row-nav);margin:0 8px 1px;padding:0 10px;border-radius:var(--r-ctl);
  display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;
  color:var(--tx-2);width:calc(100% - 16px);text-align:left;
  transition:background var(--d-fast) linear}
.nav:hover{background:var(--bg-hover-sb)}
.nav.sel{background:var(--accent-wash);color:var(--tx-hi);font-weight:600;
  box-shadow:inset 2px 0 0 var(--accent)}
.nav .ic{color:var(--tx-4)}
.pill{min-width:18px;height:16px;padding:0 5px;border-radius:var(--r-pill);
  background:var(--accent-solid);color:#fff;font:var(--t-meta);font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.pill.danger{background:var(--danger)}
#sb-scroll{flex:1;overflow-y:auto;padding-bottom:8px}
.sec-head{height:26px;display:flex;align-items:center;gap:6px;padding:0 16px;
  font:var(--t-label);letter-spacing:var(--tracking-label);color:var(--tx-4);
  text-transform:uppercase;position:sticky;top:0;background:var(--bg-sidebar);z-index:1;
  width:100%;text-align:left}
.sec-head .ic{width:10px;height:10px;transition:transform var(--d-fast) var(--e-out)}
.sec-head.closed .ic{transform:rotate(-90deg)}
.sec-head .n{margin-left:auto;color:var(--tx-4);font:var(--t-meta)}
.proj{height:var(--row-proj);margin:0 8px 1px;padding:0 10px 0 12px;border-radius:var(--r-ctl);
  display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;
  color:var(--tx-2);width:calc(100% - 16px);text-align:left;
  transition:background var(--d-fast) linear}
.proj:hover{background:var(--bg-hover-sb)}
.proj .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj.unread .nm{color:var(--tx-hi);font-weight:600}
.proj.sel{background:var(--accent-wash);box-shadow:inset 2px 0 0 var(--accent)}
.proj.sel .nm{color:var(--tx-hi);font-weight:600}
.proj.stalled .nm{opacity:.55}
.proj .tr{display:flex;align-items:center;gap:5px}
.dot5{width:5px;height:5px;border-radius:50%;background:var(--tx-4);flex:none}
.dot6{width:6px;height:6px;border-radius:50%;background:var(--danger);flex:none}
.proj .ic{color:var(--tx-4)}
#sb-foot{height:44px;flex:none;border-top:1px solid var(--line-hair);background:var(--bg-app);
  display:flex;align-items:center;padding:0 8px 0 14px;gap:8px}
#presence{display:flex;align-items:center;padding:2px 4px;border-radius:var(--r-ctl);
  transition:background var(--d-fast) linear}
#presence:hover{background:var(--bg-hover-sb)}
#presence .av{--surf:var(--bg-app);margin-left:-7px;box-shadow:0 0 0 2px var(--bg-app),inset 0 0 0 1px rgba(255,255,255,.06)}
#presence .av:first-child{margin-left:0}
#pres-n{font:var(--t-meta);color:var(--tx-3)}
#sb-foot .sp{flex:1}

/* ============================================================ 3. MAIN */
#main{flex:1;min-width:560px;display:flex;flex-direction:column;background:var(--bg-canvas);
  position:relative;min-height:0}
#header{height:60px;flex:none;padding:0 16px 0 24px;display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;align-items:center;background:var(--bg-canvas);
  border-bottom:1px solid var(--line-hair);box-shadow:0 1px 0 rgba(0,0,0,.25);
  z-index:var(--z-header);position:relative}
#b-ham{display:none;margin-right:10px}
#h-l{min-width:0}
#h-line1{display:flex;align-items:center;gap:8px;min-width:0}
#h-name{font:var(--t-title);color:var(--tx-hi);letter-spacing:var(--tracking-title);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spill{height:18px;padding:0 7px;border-radius:var(--r-pill);background:rgba(255,255,255,.06);
  color:var(--tx-3);font:var(--t-label);letter-spacing:var(--tracking-label);
  text-transform:uppercase;display:inline-flex;align-items:center;flex:none}
.spill.act{color:var(--ok);background:var(--ok-tint)}
#h-topic{font:var(--t-meta);color:var(--tx-3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;cursor:pointer;text-align:left;width:100%;margin-top:1px;
  display:block;padding:0}
#h-topic.no-goal{color:var(--tx-4)}
#h-r{display:flex;align-items:center;gap:6px}
.segs{display:flex;background:var(--bg-sunken);border-radius:var(--r-ctl);padding:2px;height:28px;
  position:relative}
.segs .seg{height:24px;padding:0 10px;border-radius:4px;font:var(--t-meta);color:var(--tx-3);
  display:inline-flex;align-items:center;gap:6px;z-index:1;transition:color var(--d-ui) linear}
.segs .seg.on{color:var(--tx-hi)}
.segs .thumb{position:absolute;top:2px;left:2px;height:24px;border-radius:4px;
  background:var(--bg-active);box-shadow:var(--sh-1);transition:transform var(--d-ui) var(--e-out),width var(--d-ui) var(--e-out)}
.segs .seg .n{font-variant-numeric:tabular-nums;color:var(--tx-4)}
.split{display:flex;align-items:center;height:28px;border-radius:var(--r-ctl);background:var(--bg-active)}
.split .a{padding:0 10px;height:28px;display:inline-flex;align-items:center;gap:6px;
  border-radius:var(--r-ctl) 0 0 var(--r-ctl);font:var(--t-meta);color:var(--tx-2)}
.split .b{width:22px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  border-left:1px solid var(--line);border-radius:0 var(--r-ctl) var(--r-ctl) 0;color:var(--tx-3)}
.split .a:hover,.split .b:hover{background:var(--bg-hover)}
.dotmark{position:relative}
.dotmark::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;
  border-radius:50%;background:var(--accent)}

/* attention banner + reconnect + find */
#attn{height:36px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px 0 22px;
  font:var(--t-sm);color:var(--tx-2);background:var(--danger-tint);
  box-shadow:inset 2px 0 0 var(--danger)}
#attn.warn{background:var(--warn-tint);box-shadow:inset 2px 0 0 var(--warn)}
/* the banner is a fixed 36px box, so its text must be single-line and elliptical
   at EVERY width; a character cap in JS is only ever right at one width */
#attn .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#attn button{flex:none;font:var(--t-meta);color:var(--tx-2);padding:2px 8px;border-radius:var(--r-ctl)}
#attn button:hover{background:rgba(255,255,255,.07);color:var(--tx-hi)}
#recon{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 24px;
  background:rgba(229,83,75,.13);border-bottom:1px solid rgba(229,83,75,.3);
  font:var(--t-meta);color:#f0a8a2}
.spin{width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;
  border-top-color:transparent;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
#find{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px 0 24px;
  background:var(--bg-raised);border-bottom:1px solid var(--line-hair)}
#find input{flex:1;background:none;border:0;outline:0;font:var(--t-ui);color:var(--tx-hi)}
#find .cnt{font:var(--t-meta);color:var(--tx-3);font-variant-numeric:tabular-nums}
mark{background:rgba(209,164,24,.28);color:inherit;border-radius:2px}
mark.cur{background:var(--warn-tint);outline:1px solid var(--warn)}

/* ============================================================ 4.5 TIMELINE */
#scroller{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;
  position:relative;min-height:0}
#timeline{padding:12px 0 16px}
.row{display:grid;grid-template-columns:var(--gutter) minmax(0,1fr);column-gap:var(--gap);
  padding:8px var(--pad-x);position:relative;content-visibility:auto;contain-intrinsic-size:0 64px}
.row:hover{background:var(--bg-hover)}
.row.grouped{padding-top:2px}
.row .gutter{position:relative}
.row.grouped .gutter::after{content:attr(data-time);font:var(--t-mono-in);color:var(--tx-3);
  opacity:0;display:block;text-align:right;padding-right:2px}
.row.grouped:hover .gutter::after{opacity:1}
.row.grouped .av,.row.grouped .nameline{display:none}
.row.k-blocker{box-shadow:inset 2px 0 0 var(--k-blocker)}
.row.k-directive{box-shadow:inset 2px 0 0 var(--k-directive)}
.row .av{--av:36px;transform:translateY(1px)}
.nameline{display:flex;align-items:baseline;gap:8px;min-height:20px;flex-wrap:wrap}
.nameline .nm{font:var(--t-body);font-weight:650;letter-spacing:-.003em;color:var(--who)}
.nameline .ts{font:var(--t-meta);color:var(--tx-3)}
.badge{height:16px;padding:0 6px;border-radius:var(--r-chip);font:var(--t-label);
  letter-spacing:var(--tracking-label);text-transform:uppercase;display:inline-flex;
  align-items:center;align-self:center;color:var(--k-neutral);background:var(--k-neutral-bg)}
.badge.b-blocker{color:var(--k-blocker);background:var(--k-blocker-bg);box-shadow:inset 0 0 0 1px rgba(229,83,75,.30)}
.badge.b-directive{color:var(--k-directive);background:var(--k-directive-bg)}
.badge.b-question{color:var(--k-question);background:var(--k-question-bg)}
.badge.b-decision{color:var(--k-decision);background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k-decision) 40%,transparent)}
.pchip{height:16px;padding:0 6px;border-radius:var(--r-chip);border:1px solid var(--line-hair);
  font:var(--t-meta);color:var(--tx-3);display:inline-flex;align-items:center;align-self:center}
.pchip:hover{color:var(--tx-hi);border-color:var(--line)}

/* hover action cluster */
#acts{position:absolute;top:-14px;right:16px;height:30px;background:var(--bg-raised);
  border:1px solid var(--line);border-radius:var(--r-ctl);box-shadow:var(--sh-2);
  z-index:var(--z-hover);display:none;align-items:center;padding:0 2px;gap:0;opacity:0;
  transition:opacity var(--d-fast) linear}
.row:hover>#acts,.row:focus-within>#acts{display:flex;opacity:1}
#acts .gb{height:26px;min-width:26px}

/* body / report renderer */
.bodywrap{position:relative}
.body{font:var(--t-body);color:var(--tx);position:relative}
.body.clamped{max-height:180px;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 118px,transparent 178px);
          mask-image:linear-gradient(#000 118px,transparent 178px)}
.body p{margin:0 0 8px;max-width:var(--measure);overflow-wrap:anywhere}
.body p:last-child{margin-bottom:0}
.body .lede{font:var(--t-lede);color:var(--tx-hi);margin:0 0 6px;max-width:var(--measure);
  overflow-wrap:anywhere}
.body ul,.body ol{margin:0 0 8px;padding-left:20px;max-width:var(--measure)}
.body li{margin-bottom:4px}
.body li::marker{color:var(--tx-4)}
.body ol{font-variant-numeric:tabular-nums}
.body pre{font:var(--t-mono);color:var(--tx-2);background:var(--bg-sunken);
  border:1px solid var(--line-hair);border-radius:var(--r-ctl);padding:8px 10px;margin:6px 0 10px;
  white-space:pre;overflow-x:auto;max-height:260px;overscroll-behavior:contain;tab-size:2;
  position:relative}
.pw{position:relative;margin:6px 0 10px}
.pw pre{margin:0}
.pw .cpy{position:absolute;top:4px;right:4px;opacity:0;background:var(--bg-raised);
  border:1px solid var(--line-hair)}
.pw:hover .cpy{opacity:1}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:16px;row-gap:4px;
  background:var(--bg-sunken);border:1px solid var(--line-hair);border-radius:var(--r-ctl);
  padding:8px 10px;margin:0;overflow-x:auto}
.kv dt{font:var(--t-mono-in);color:var(--tx-3);white-space:nowrap}
.kv dd{font:var(--t-mono);color:var(--tx-2);margin:0;overflow-wrap:anywhere}
.kv .span{grid-column:1/-1;font:var(--t-mono);color:var(--tx-2);white-space:pre-wrap;overflow-wrap:anywhere}
/* One right edge per message: the section's own right-aligned metadata must land
   on the same ruler as the prose. -12px margin + 10px pad + 2px rule = the 12px
   the measure has to grow by so the CONTENT box is exactly --measure wide. */
.sec{margin:14px 0 4px;padding-left:10px;margin-left:-12px;border-left:2px solid var(--tone-neutral);
  max-width:calc(var(--measure) + 12px)}
.sec:first-child{margin-top:0}
.sec.t-danger{border-left-color:var(--tone-danger)}
.sec.t-warn{border-left-color:var(--tone-warn)}
.sec.t-ok{border-left-color:var(--tone-ok)}
.sec>.sh{display:flex;align-items:center;gap:6px;min-height:20px;width:100%;text-align:left;
  border-radius:var(--r-chip)}
.sec.closed>.sh{min-height:var(--row-sec)}
.sec.closed:hover>.sh{background:var(--bg-hover)}
.sec>.sh .lb{font:var(--t-label);letter-spacing:var(--tracking-label);text-transform:uppercase;
  color:var(--tx-2)}
.sec.closed>.sh .lb{font:var(--t-ui);font-weight:650;color:var(--tx);text-transform:uppercase;
  font-size:11px;letter-spacing:var(--tracking-label)}
.sec>.sh .ql{font:var(--t-meta);color:var(--tx-3)}
.sec>.sh .sm{margin-left:auto;font:var(--t-meta);color:var(--tx-4)}
.sec>.sh .ic{color:var(--tx-4);transform:rotate(0);transition:transform var(--d-fast) var(--e-out)}
.sec.closed>.sh .ic{transform:rotate(-90deg)}
.sec>.sh .ic{display:none}
.sec.foldable>.sh .ic{display:block}
.sec>.sc{margin-top:4px}
.sec.closed>.sc{display:none}
.expander{display:flex;align-items:center;gap:6px;height:24px;font:var(--t-meta);
  color:var(--tx-3);margin-top:2px;width:100%;max-width:var(--measure);text-align:left}
.expander:hover{color:var(--accent)}
.expander .hint{margin-left:auto;color:var(--tx-4)}
code.hash{font:var(--t-mono-in);color:color-mix(in srgb,var(--accent) 85%,var(--tx));
  background:rgba(110,168,254,.10);padding:0 4px;border-radius:var(--r-chip);cursor:pointer}
code.hash.flash,.flash-ok{background:var(--ok-tint)!important;color:var(--ok)!important}
code.ic-code{font:var(--t-mono-in);background:var(--bg-sunken);padding:0 4px;border-radius:var(--r-chip)}
code.path{font:var(--t-mono-in);color:var(--tx-2);background:rgba(255,255,255,.045);
  padding:0 4px;border-radius:var(--r-chip);cursor:pointer}
code.branch{font:var(--t-mono-in);border:1px solid var(--line-hair);border-radius:var(--r-pill);
  padding:0 7px;color:var(--who,var(--tx-2))}
.body b{font-weight:650;color:var(--tx-hi)}
.body a.url{color:var(--accent);text-decoration:underline;
  text-decoration-color:rgba(110,168,254,.4);text-underline-offset:2px;cursor:pointer}
.tchip{font:var(--t-mono-in);color:var(--tx-2);background:rgba(255,255,255,.05);
  padding:0 5px;border-radius:var(--r-chip);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.tchip .sd{width:5px;height:5px;border-radius:50%;background:var(--tx-4)}
.tchip .sd.doing{background:var(--accent)} .tchip .sd.done{background:var(--ok)}
.tchip .sd.blocked{background:var(--danger)}
.tchip:hover{background:rgba(110,168,254,.14);color:var(--tx-hi)}

/* ============================================================ 4.9 SYSTEM ROWS */
.sys{display:grid;grid-template-columns:var(--gutter) minmax(0,1fr);column-gap:var(--gap);
  padding:3px var(--pad-x);min-height:var(--row-sys);align-items:center;font:var(--t-sm);
  color:var(--tx-3);content-visibility:auto;contain-intrinsic-size:0 26px;
  width:100%;text-align:left}
.sys:hover{background:var(--bg-hover)}
/* ONLY the 36px gutter icon centres itself in its track. A descendant selector
   here also caught the chevron inside .ln, which then split the row's free space
   three ways with .rt and floated 146px from its own label. */
.sys>.ic{color:var(--tx-4);margin:0 auto}
.sys .ln .ic{color:var(--tx-4);margin:0}
.sys .ln{display:flex;align-items:center;gap:7px;min-width:0}
.sys .sub{color:var(--tx-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sys .ghash{font:var(--t-mono-in);color:var(--accent);cursor:pointer}
.sys .tag{font:var(--t-mono-in);color:var(--tx-4);border:1px solid var(--line-hair);
  height:16px;border-radius:var(--r-pill);padding:0 6px;display:inline-flex;align-items:center;flex:none}
.sys .rt{margin-left:auto;font:var(--t-meta);color:var(--tx-4);flex:none;padding-left:8px}
.sys .idc{font:var(--t-mono-in);color:var(--tx-4)}
.sys.danger .sub{color:var(--danger)}
.sys .chev{transition:transform var(--d-fast) var(--e-out)}
.sys.open .chev{transform:rotate(0)} .sys.grp .chev{transform:rotate(-90deg)}
.sys.grp.open .chev{transform:rotate(0)}
.sys.child{padding-left:calc(var(--pad-x) + 12px)}

/* ============================================================ 4.10 DIVIDERS */
.day{position:sticky;top:10px;z-index:var(--z-day);height:1px;margin:16px 0 8px;
  background:var(--line-hair);contain:layout}
.day>span{position:relative;top:-9px;left:var(--pad-x);display:inline-block;padding:1px 10px;
  background:var(--bg-canvas);border:1px solid var(--line-hair);border-radius:var(--r-pill);
  font:var(--t-label);letter-spacing:var(--tracking-label);color:var(--tx-3)}
/* Stuck: the pill floats over whatever row is scrolling beneath it, so the stuck
   band must paint the FULL row width, not just the label. Drawn as an out-of-flow
   pseudo-element so the divider's own geometry (1px + margins) never changes and
   the list cannot jump at the moment stickiness engages. */
.day.stuck::before{content:"";position:absolute;left:0;right:0;top:-14px;height:28px;
  background:var(--bg-canvas);box-shadow:0 1px 0 var(--line-hair)}
.day.stuck>span{background:var(--bg-raised);box-shadow:var(--sh-1)}
.newdiv{height:1px;margin:16px 0 8px;background:rgba(229,83,75,.55);contain:layout;position:relative}
.newdiv>span{position:absolute;top:-9px;right:var(--pad-x);padding:1px 10px;
  background:var(--bg-canvas);font:var(--t-label);letter-spacing:var(--tracking-label);
  color:var(--danger)}
.termrow{padding:6px var(--pad-x) 6px var(--origin);font:var(--t-meta);color:var(--tx-4)}
.loadmore{height:32px;display:flex;align-items:center;padding:0 var(--pad-x) 0 var(--origin);
  font:var(--t-meta);color:var(--tx-3);width:100%;text-align:left}
.loadmore:hover{color:var(--accent);background:var(--bg-hover)}
#jump{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);height:30px;
  background:var(--accent-solid);color:#fff;border-radius:var(--r-pill);box-shadow:var(--sh-2);
  display:none;align-items:center;gap:6px;padding:0 14px;font:var(--t-meta);font-weight:600;
  z-index:var(--z-hover);animation:jumpin var(--d-ui) var(--e-out)}
@keyframes jumpin{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.row-enter{animation:rowin var(--d-enter) var(--e-out),flash var(--d-flash) var(--e-in)}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes flash{from{background:var(--accent-wash)}to{background:transparent}}
.flashrow{animation:flash var(--d-flash) var(--e-in)}

/* ============================================================ 4.11 COMPOSER */
#composer{margin:0 24px 20px;flex:none;background:var(--bg-raised);border:1px solid var(--line);
  border-radius:var(--r-panel);box-shadow:var(--sh-1),var(--sh-inset-top);min-height:88px;
  display:flex;flex-direction:column;transition:box-shadow var(--d-fast) linear,border-color var(--d-fast) linear}
#composer:focus-within{border-color:#4b7fd4;box-shadow:0 0 0 3px rgba(110,168,254,.20),var(--sh-inset-top)}
#composer.k-directive{box-shadow:inset 3px 0 0 var(--accent),var(--sh-1)}
#composer.k-question{box-shadow:inset 3px 0 0 var(--warn),var(--sh-1)}
#c-body{flex:1;background:none;border:0;outline:0;resize:none;padding:12px 14px 6px;
  font:var(--t-body);min-height:44px;max-height:240px;overflow-y:auto}
#c-body::placeholder{color:var(--tx-4)}
#c-bar{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px}
#c-bar .sp{flex:1}
#c-kind{height:26px;padding:0 8px;border-radius:var(--r-ctl);font:var(--t-meta);color:var(--tx-2);
  display:inline-flex;align-items:center;gap:6px}
#c-kind:hover{background:var(--bg-hover)}
#c-kind .kd{width:6px;height:6px;border-radius:50%;background:var(--accent)}
#c-hint{font:var(--t-meta);color:var(--tx-4)}
#gstrip{margin:0 24px 20px;height:40px;flex:none;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--bg-raised);border:1px solid var(--line);
  border-radius:var(--r-panel);font:var(--t-sm);color:var(--tx-3)}
kbd{font:var(--t-meta);font-family:var(--f-mono);background:var(--bg-active);color:var(--tx-2);
  border-radius:var(--r-chip);padding:1px 5px;border:1px solid var(--line-hair)}

/* ============================================================ 4.12 BOARD */
#board{flex:1;min-height:0;padding:20px 24px;display:grid;
  grid-template-columns:repeat(4,minmax(260px,1fr));gap:16px;overflow:auto}
.col{background:var(--bg-app);border-radius:var(--r-panel);padding:8px;display:flex;
  flex-direction:column;min-height:0}
.col.over{box-shadow:inset 0 0 0 2px rgba(110,168,254,.55);background:rgba(110,168,254,.05)}
.col>h3{height:32px;margin:0;display:flex;align-items:center;gap:8px;padding:0 6px;
  font:var(--t-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--tx-3)}
.col>h3 .n{height:18px;min-width:18px;padding:0 6px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.06);display:inline-flex;align-items:center;justify-content:center;
  font:var(--t-meta);color:var(--tx-3)}
.col>h3 .sp{flex:1}
.col>h3 .gb{opacity:0}
.col:hover>h3 .gb{opacity:1}
.cards{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.card{background:var(--bg-raised);border:1px solid var(--line-hair);border-radius:var(--r-card);
  padding:10px 12px;box-shadow:var(--sh-1);cursor:grab;
  transition:background var(--d-fast) linear,border-color var(--d-fast) linear,
             box-shadow var(--d-fast) linear,transform var(--d-fast) linear}
.card:hover{border-color:var(--line);box-shadow:var(--sh-2);transform:translateY(-1px)}
.card.drag{opacity:.85;transform:rotate(1.5deg) scale(1.02);box-shadow:var(--sh-3);cursor:grabbing}
.card.ghost{opacity:.5}
.card .tt{font:var(--t-sm);color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.card .ft{display:flex;align-items:center;gap:6px;height:18px;margin-top:8px}
.card .ft .un{color:var(--tx-4);font-style:italic;font:var(--t-meta)}
.card .ft .id{margin-left:auto;font:var(--t-mono-in);color:var(--tx-4)}
.card .ft .nm{font:var(--t-meta);color:var(--who)}
.card.s-todo{box-shadow:inset 2px 0 0 var(--tx-4),var(--sh-1)}
.card.s-doing{box-shadow:inset 2px 0 0 var(--accent),var(--sh-1)}
.card.s-blocked{box-shadow:inset 2px 0 0 var(--danger),var(--sh-1)}
.card.s-done{box-shadow:inset 2px 0 0 color-mix(in srgb,var(--ok) 45%,transparent),var(--sh-1)}
.card.revert{animation:flashbad 2s var(--e-in)}
@keyframes flashbad{from{background:var(--danger-tint)}to{background:var(--bg-raised)}}
.insline{height:2px;border-radius:2px;background:var(--accent);margin:0 2px}
.addrow{height:32px;display:flex;align-items:center;gap:6px;padding:0 8px;font:var(--t-sm);
  color:var(--tx-3);border-radius:var(--r-ctl);width:100%;text-align:left}
.addrow:hover{background:var(--bg-hover);color:var(--tx)}
.addform{background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--r-card);
  padding:8px;display:flex;flex-direction:column;gap:6px}
.addform input{background:var(--bg-sunken);border:1px solid var(--line-hair);border-radius:var(--r-ctl);
  padding:6px 8px;outline:0;font:var(--t-sm)}
.addform .rw{display:flex;gap:6px;align-items:center}
.showolder{height:30px;display:flex;align-items:center;justify-content:center;font:var(--t-meta);
  color:var(--tx-3);border-radius:var(--r-ctl);width:100%}
.showolder:hover{background:var(--bg-hover);color:var(--tx)}

/* ============================================================ 4.13 INSPECTOR */
#inspector{width:320px;min-width:320px;background:var(--bg-raised);
  border-left:1px solid var(--line-hair);overflow-y:auto;flex:none}
.isec{border-bottom:1px solid var(--line-hair);padding:12px 16px}
.isec>h4{margin:0 0 8px;font:var(--t-label);letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--tx-4);display:flex;align-items:center;gap:6px;
  width:100%;text-align:left}
.isec>h4 .ic{width:10px;height:10px;transition:transform var(--d-fast) var(--e-out);color:var(--tx-4)}
.isec.closed>h4 .ic{transform:rotate(-90deg)}
.isec.closed>.ic-body{display:none}
.isec .em{font:var(--t-sm);color:var(--tx-4)}
#i-prog .big{font:var(--t-title);color:var(--tx-hi);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--bg-sunken);border-radius:3px;overflow:hidden;margin:8px 0}
.track>div{height:100%;background:var(--ok);transition:width 400ms var(--e-out)}
.micro{display:flex;gap:12px;flex-wrap:wrap;font:var(--t-meta);color:var(--tx-3)}
.micro span{display:inline-flex;align-items:center;gap:5px}
.wt{display:flex;flex-direction:column;gap:2px;padding:6px 0;border-bottom:1px solid var(--line-hair)}
.wt:last-child{border-bottom:0}
.wt .b1{display:flex;align-items:center;gap:7px;font:var(--t-mono-in)}
.wt .b1 .br{color:var(--who,var(--tx-2));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt .ah{color:var(--ok)} .wt .bh{color:var(--warn)} .wt .dy{color:var(--danger)}
.wt .pth{font:var(--t-meta);color:var(--tx-4);direction:rtl;text-align:left;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.crow{display:flex;align-items:center;gap:8px;padding:5px 0;font:var(--t-sm)}
.crow .nm{color:var(--who)} .crow .st{margin-left:auto;font:var(--t-meta);color:var(--tx-3)}
.crow .st.ok{color:var(--ok)}
.crow .gb{opacity:0} .crow:hover .gb{opacity:1}
.wdchip{display:flex;align-items:center;gap:6px;background:var(--bg-sunken);border-radius:var(--r-ctl);
  padding:6px 8px;font:var(--t-mono-in);color:var(--tx-2);min-width:0}
.wdchip .p{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wdchip input{flex:1;background:none;border:0;outline:0;font:var(--t-mono-in);min-width:0}

/* ============================================================ POPOVERS/MODAL */
#pops{position:fixed;inset:0;z-index:var(--z-pop);pointer-events:none}
.pop{position:absolute;background:var(--bg-raised);border:1px solid var(--line);
  border-radius:var(--r-card);box-shadow:var(--sh-2);padding:4px;pointer-events:auto;
  animation:popin var(--d-fast) var(--e-out);min-width:180px}
@keyframes popin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.pop .it{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-ctl);
  width:100%;text-align:left;font:var(--t-sm);color:var(--tx-2)}
.pop .it:hover{background:var(--bg-hover);color:var(--tx-hi)}
.pop .it .sub{color:var(--tx-4);font:var(--t-meta)}
.pop .it .rt{margin-left:auto;color:var(--tx-4);font:var(--t-meta)}
.pop .hd{padding:6px 8px 4px;font:var(--t-label);letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--tx-4)}
.pop .sep{height:1px;background:var(--line-hair);margin:4px 0}
.pop .sw{margin-left:auto;width:28px;height:16px;border-radius:8px;background:var(--bg-active);
  position:relative;flex:none;transition:background var(--d-fast) linear}
.pop .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;
  border-radius:50%;background:var(--tx-3);transition:transform var(--d-fast) var(--e-out)}
.pop .it.on .sw{background:var(--accent-solid)}
.pop .it.on .sw::after{transform:translateX(12px);background:#fff}
#scrim{position:fixed;inset:0;background:var(--bg-scrim);z-index:var(--z-modal);display:none}
.modal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:560px;max-width:92vw;
  background:var(--bg-raised);border-radius:var(--r-modal);box-shadow:var(--sh-3);
  z-index:var(--z-modal);animation:popin var(--d-ui) var(--e-spring);overflow:hidden}
.modal h3{margin:0;padding:16px 18px 6px;font:var(--t-display);color:var(--tx-hi)}
.modal .bd{padding:6px 18px 16px;display:flex;flex-direction:column;gap:10px}
.modal .ft{display:flex;gap:8px;justify-content:flex-end;padding:0 18px 16px}
.fld label{display:block;font:var(--t-meta);color:var(--tx-3);margin-bottom:4px}
.fld input{width:100%;background:var(--bg-sunken);border:1px solid var(--line-hair);
  border-radius:var(--r-ctl);padding:8px 10px;outline:0;font:var(--t-ui)}
.fld input:focus{border-color:var(--accent-line)}
.fld .err{font:var(--t-meta);color:var(--danger);margin-top:4px;display:none}
.fld.bad input{border-color:var(--danger)} .fld.bad .err{display:block}
/* palette */
#pal{width:560px}
#pal .inp{height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;
  border-bottom:1px solid var(--line-hair)}
#pal .inp input{flex:1;background:none;border:0;outline:0;font:18px/24px var(--f-ui);color:var(--tx-hi)}
#pal .res{max-height:320px;overflow-y:auto;padding:6px}
#pal .r{height:40px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:var(--r-ctl);
  width:100%;text-align:left;font:var(--t-ui);color:var(--tx-2)}
#pal .r .rt{margin-left:auto;font:var(--t-meta);color:var(--tx-4)}
#pal .r.on{background:var(--accent-wash);box-shadow:inset 2px 0 0 var(--accent);color:var(--tx-hi)}
#pal .r em{font-style:normal;font-weight:650;color:var(--accent)}
#pal .gh{padding:8px 10px 4px;font:var(--t-label);letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--tx-4)}
/* toasts */
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:var(--z-toast);
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{width:320px;background:var(--bg-raised);box-shadow:var(--sh-2);border-radius:var(--r-card);
  font:var(--t-sm);color:var(--tx-2);padding:10px 12px;display:flex;align-items:center;gap:10px;
  pointer-events:auto;animation:popin var(--d-ui) var(--e-out)}
.toast.bad{box-shadow:var(--sh-2),inset 2px 0 0 var(--danger)}
.toast button{margin-left:auto;font:var(--t-meta);color:var(--accent);padding:2px 6px;border-radius:4px}
.toast button:hover{background:var(--bg-hover)}
/* empty + skeleton */
.emptystate{max-width:340px;margin:12vh auto 0;text-align:center;display:flex;flex-direction:column;
  align-items:center;gap:10px}
.emptystate .ic{width:48px;height:48px;stroke-width:1.25;color:var(--tx-4)}
.emptystate h2{margin:0;font:var(--t-display);color:var(--tx-2)}
.emptystate p{margin:0;font:var(--t-sm);color:var(--tx-3);line-height:1.6}
.skel{background:linear-gradient(90deg,var(--bg-hover) 0 40%,#22272f 50%,var(--bg-hover) 60% 100%);
  background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:4px}
@keyframes shimmer{to{background-position:-200% 0}}
/* needs view */
#needs{flex:1;overflow-y:auto;padding:20px 24px}
#needs .wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#needs .gh{font:var(--t-label);letter-spacing:var(--tracking-label);text-transform:uppercase;
  color:var(--tx-4);margin-top:10px}
.ncard{background:var(--bg-raised);border:1px solid var(--line-hair);border-radius:var(--r-card);
  padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.ncard .cb{min-width:0;flex:1}
.ncard .t1{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.ncard .lede{font:var(--t-sm);color:var(--tx-2);display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.ncard .ag{font:var(--t-meta);color:var(--tx-4)}

/* ============================================================ BREAKPOINTS */
@media (max-width:1439px){
  #inspector{position:absolute;top:60px;right:0;bottom:0;z-index:var(--z-drawer);
    box-shadow:var(--sh-3);animation:slidein var(--d-panel) var(--e-out)}
  @keyframes slidein{from{transform:translateX(16px);opacity:.6}to{transform:none;opacity:1}}
}
@media (max-width:1179px){
  :root{--sb-w:220px}
  /* §3: "hides the count pill, shows a 5px dot" — the count goes, the SIGNAL
     never does. display:none here silently deleted every unread marker. */
  .proj .pill{min-width:5px;width:5px;height:5px;padding:0;font-size:0;border-radius:50%}
}
@media (max-width:939px){
  :root{--sb-w:56px}
  /* the hamburger is the ONLY control that reaches the sidebar below 940, so it
     lives in the main header where it survives the drawer being closed */
  #b-ham{display:inline-flex}
  #sidebar.rail #brand .wt,#sidebar.rail .nav>span:not(.pill),#sidebar.rail .sec-head,
  #sidebar.rail .proj .nm,#sidebar.rail .proj .ic,#sidebar.rail #pres-n,
  #sidebar.rail #brand .gb{display:none}
  #sidebar.rail .proj{grid-template-columns:1fr;justify-items:center;padding:0;position:relative}
  #sidebar.rail .nav{grid-template-columns:1fr;justify-items:center;padding:0;position:relative}
  /* at 40px wide an inset left rule reads as a stray bracket: the selected state
     is the full-bleed wash and nothing else */
  #sidebar.rail .nav.sel,#sidebar.rail .proj.sel{box-shadow:none;background:var(--accent-wash)}
  /* unread must survive the rail: the pill/dot collapses to a 6px marker on the
     avatar's corner rather than disappearing with the label */
  #sidebar.rail .proj .tr{position:absolute;top:1px;right:6px;gap:2px}
  #sidebar.rail .nav .pill{position:absolute;top:2px;right:8px}
  #sidebar.rail .pill{min-width:6px;width:6px;height:6px;padding:0;font-size:0;
    border-radius:50%;box-shadow:0 0 0 2px var(--bg-sidebar)}
  #sidebar.rail .dot5,#sidebar.rail .dot6{box-shadow:0 0 0 2px var(--bg-sidebar)}
  #sidebar.rail #brand{padding:0;justify-content:center}
  #sidebar.rail #brand .mk{display:block}
  #sidebar.rail #presence .av:not(:first-child){display:none}
  #sidebar.rail #presence{margin:0 auto;padding:2px}
  #sidebar.rail #sb-foot{padding:0 0 6px;justify-content:center}
  #sidebar.rail #sb-foot .sp,#sidebar.rail #b-menu{display:none}
  #c-hint{display:none}
}
/* Below 720 the sidebar is a real 260px drawer with full labels: the rail rules
   above are gated on the .rail class, which JS only sets in [720,940). */
@media (max-width:719px){
  #sidebar{position:absolute;left:0;top:0;bottom:0;z-index:var(--z-drawer);box-shadow:var(--sh-3);
    --sb-w:260px}
  #sidebar.away{display:none}
  #main{min-width:0}
}

<script>
"use strict";
/* ============================================================ 1. CONFIG */
const IDENTITY = {
  claude:   {mono:"C", hue:"var(--claude)"},
  codex:    {mono:"X", hue:"var(--codex)"},
  deepseek: {mono:"D", hue:"var(--deepseek)"},
  user:     {mono:"U", hue:"var(--user)"},
};
const AGENTS = ["claude","codex","deepseek"];
const ORDER  = ["claude","codex","deepseek","user"];
const PHUE = ["var(--p0)","var(--p1)","var(--p2)","var(--p3)","var(--p4)","var(--p5)","var(--p6)","var(--p7)"];
/* badge kinds only; update + note deliberately carry no badge */
const BADGED = new Set(["directive","blocker","question","decision","handoff","answer"]);
const POST_KINDS = [
  ["directive","overrides the agents' current plan"],
  ["question","you need an answer before they continue"],
  ["answer","replies to an agent's question"],
  ["note","context, no action implied"],
];
const KIND_HUE = {directive:"var(--k-directive)",question:"var(--k-question)",
                  answer:"var(--k-neutral)",note:"var(--k-neutral)"};
const TONE = [
  [/BLOCK|TRAP|FAIL|BROKEN|RISK|DO NOT|WARN|REGRESS|CORRECTION|LIMITATION/, "danger", true],
  [/OPEN|NEXT|TODO|CARRIED|PENDING|HELD|ASK|NEEDS|HONEST|QUESTION/,         "warn",   true],
  [/GATE|TEST|PASS|SMOKE|VERIF|PROVEN|PROOF/,                               "ok",     false],
];
const VERB = {doing:["started","i-arrow-r",""], done:["finished","i-check",""],
              blocked:["blocked","i-arrow-r","danger"], todo:["reopened","i-arrow-r",""],
              dropped:["dropped","i-x",""], created:["added","i-plus",""]};
const COLS = ["todo","doing","blocked","done"];
/* one owner: the global handler binds from it and the ? sheet renders from it */
const KEYMAP = [
  ["Ctrl+K","Command palette","palette"],
  ["Ctrl+B","Toggle sidebar","sidebar"],
  ["Ctrl+.","Toggle inspector","inspector"],
  ["Ctrl+F","Find in channel","find"],
  ["Ctrl+Shift+N","New project","newproject"],
  ["Ctrl+1..9","Jump to the nth project",""],
  ["Alt+Up / Alt+Down","Previous / next project",""],
  ["Alt+Shift+Up / Down","Previous / next unread project",""],
  ["Ctrl+Enter","Send",""],
  ["Shift+Enter","Newline",""],
  ["Esc","Close topmost layer, else mark read",""],
  ["/","Focus composer",""],
  ["g then a / b","Go to Activity / Board",""],
  ["f","Filter popover",""],
  ["s","Summon menu",""],
  ["t","New task (Board)",""],
  ["j / k","Next / previous row",""],
  ["o","Expand / collapse the focused report",""],
  ["c","Copy the focused row's permalink",""],
  ["[ / ]","Move the focused card one column",""],
  ["Home / End","Oldest / newest",""],
  ["?","Shortcut sheet",""],
];

/* ============================================================ 2. STORE */
const S = {
  projects:[], agents:[], attention:null, now:new Date().toISOString(),
  sel:null, globalView:"activity", view:"activity",
  insp:{open:false, sections:{}},
  byProject:Object.create(null),
  activity:[],
  ui:{ expanded:new Set(), sysOpen:new Set(), filters:{}, drafts:{}, readMark:{},
       window:200, dragging:false, popover:null, editing:false, editors:new Set(), kind:"note",
       firstPaint:true, seen:new Set(), attnDismissed:new Set(), doneShowAll:false,
       sbAway:false, sbSmall:null, find:null, adding:false, pending:[] }
};
const fmtCache = new Map();     // message id -> .bodywrap element (bodies are immutable)
const textCache = new Map();    // message id -> lowercased plaintext (find bar)
const $ = id => document.getElementById(id);
const ls = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
};
function pd(slug){
  return S.byProject[slug] || (S.byProject[slug] =
    {project:null, messages:new Map(), order:[], tasks:new Map(), cursors:[], git:{}, ver:{}});
}
function hue(name){
  if (IDENTITY[name]) return IDENTITY[name].hue;
  return PHUE[hashN(name)];
}
function hashN(s){ let h=0; for(let i=0;i<(s||"").length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h)%8; }
function mono(name){ return IDENTITY[name] ? IDENTITY[name].mono : (name||"?")[0].toUpperCase(); }
function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls;
  if(txt!==undefined && txt!==null) e.textContent=txt; return e; }
function icon(id, cls){
  const s=document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("class","ic"+(cls?" "+cls:""));
  const u=document.createElementNS("http://www.w3.org/2000/svg","use");
  u.setAttribute("href","#"+id); s.appendChild(u); return s;
}
function avatar(name, size, agent){
  const a=el("div","av"); a.style.setProperty("--av",size+"px");
  a.style.setProperty("--who", hue(name)); a.textContent=mono(name);
  if (agent){
    const st=presState(agent);
    if (st==="p-now") a.classList.add("act");
    const d=el("span","pres "+st); d.title=agent.last_seen?("last seen "+ago(agent.last_seen)):"never seen";
    a.appendChild(d);
  }
  return a;
}
function presState(a){
  if (!a || !a.last_seen) return "p-old";
  const s=(new Date(S.now)-new Date(a.last_seen))/1000;
  if (s<120) return "p-now"; if (s<1800) return "p-recent";
  if (s<86400) return "p-day"; return "p-old";
}
function agentOf(name){ return S.agents.find(a=>a.name===name); }
function ago(iso){
  const s=Math.max(0,(new Date(S.now)-new Date(iso))/1000);
  if (s<90) return Math.round(s)+"s ago";
  if (s<5400) return Math.round(s/60)+"m ago";
  if (s<129600) return Math.round(s/3600)+"h ago";
  return Math.round(s/86400)+"d ago";
}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["SUN","MON","TUE","WED","THU","FRI","SAT"];
function clock(d){ let h=d.getHours(); const m=String(d.getMinutes()).padStart(2,"0");
  const ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+m+" "+ap; }
function fmtTs(iso){
  const d=new Date(iso), n=new Date(S.now);
  const same=d.toDateString()===n.toDateString();
  return same ? clock(d) : MON[d.getMonth()]+" "+d.getDate()+", "+clock(d);
}
function dayKey(iso){ const d=new Date(iso);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayLabel(iso){
  const d=new Date(iso), n=new Date(S.now);
  const md=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const mn=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const diff=Math.round((mn-md)/86400000);
  if (diff===0) return "TODAY"; if (diff===1) return "YESTERDAY";
  return DOW[d.getDay()]+", "+MON[d.getMonth()].toUpperCase()+" "+d.getDate();
}
function copy(text, node){
  const done=()=>{ if(node){ node.classList.add("flash"); setTimeout(()=>node.classList.remove("flash"),600);} toast("Copied"); };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done, ()=>fallbackCopy(text,done));
  else fallbackCopy(text,done);
}
function fallbackCopy(text, done){
  const t=el("textarea"); t.value=text; t.style.position="fixed"; t.style.opacity="0";
  document.body.appendChild(t); t.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast("Copy failed", {bad:true}); }
  t.remove();
}

/* ============================================================ 3. PARSE (pure) */
/* --- 3.1 task-event re-composition; falls back to the raw string --- */
const RE_MOVE  = /^task #(\d+) "(.*)": (\w+) -> (\w+)(?:, assignee -> (\S+))?$/;
const RE_MAKE  = /^created task #(\d+) "(.*?)"(?: \(assigned to (\S+)\))?$/;
function parseTaskEvent(body){
  let m=RE_MOVE.exec(body);
  if (m) return {id:+m[1], title:m[2], from:m[3], to:m[4], assignee:m[5]||"", verb:m[4]};
  m=RE_MAKE.exec(body);
  if (m) return {id:+m[1], title:m[2], assignee:m[3]||"", verb:"created"};
  return null;
}
/* --- 3.2 block classification (§5.4) --- */
const RE_BULLET=/^\s{0,3}[-*•]\s+\S/;
const RE_NUM=/^\s{0,3}\(?\d{1,2}[.)]\s+\S/;
const RE_IND=/^[ \t]{2,}\S/;
function normalise(text){
  return String(text||"").replace(/\r\n/g,"\n")
    .split("\n").map(l=>l.replace(/[ \t]+$/,"")).join("\n")
    .replace(/\n{3,}/g,"\n\n");
}
function dedent(lines){
  let min=Infinity;
  for (const l of lines){ if(!l.trim()) continue; const m=/^[ \t]*/.exec(l)[0].replace(/\t/g,"  ").length; if(m<min) min=m; }
  if (!isFinite(min)) min=0;
  return lines.map(l=>l.replace(/\t/g,"  ").slice(min));
}
/* alignment-measured key/value detection. The spec's literal two-space regex misses the
   real manifests (single-space padded columns), so the detector measures the column the
   second field actually starts at and requires >=2 rows to agree. */
function detectKv(lines){
  const cand=new Map();
  const per=lines.map(l=>{
    const out=[];
    if (/^\s/.test(l)) return out;                    // continuation line
    for (let i=1;i<l.length;i++){
      if (l[i]===" " && l[i-1]!==" "){
        let j=i; while(j<l.length && l[j]===" ") j++;
        if (j<l.length){ const key=l.slice(0,i).trim();
          if (key && key.length<=26) out.push({col:j, key, val:l.slice(j)}); }
      }
    }
    return out;
  });
  for (const opts of per) for (const o of opts) cand.set(o.col,(cand.get(o.col)||0)+1);
  let best=-1,bestN=1;
  for (const [col,n] of cand) if (n>bestN || (n===bestN && best>=0 && col<best)){ best=col; bestN=n; }
  if (best<0 || bestN<2) return null;
  return lines.map((l,i)=>{
    const hit=per[i].find(o=>o.col===best);
    return hit ? {k:hit.key, v:hit.val} : {span:l};
  });
}
function parseBlocks(text){
  const lines=normalise(text).split("\n");
  /* One owner for "does a new block start at k". The prose run needs exactly the

     the outer loop never advances. */

    else if (m[2]){ node=el("b",null,m[2].slice(2,-2)); }

      a.addEventListener("click",e=>{e.preventDefault();copy(m[3]);}); node=a; }

/* formatBody: memoised by message id. Bodies are immutable server-side, but the

        key:"gc"+it.c.short}); i=j-1; continue; }
    }

}
/* Build the ordered, filtered, collapsed item list for the selected channel. */
function buildItems(slug){
  const d=pd(slug), f=filters(slug);
  const raw=[];
  for (const m of d.order.map(id=>d.messages.get(id))){
    if (!m) continue;
    if (m.kind==="task" && !f.tasks) continue;
    raw.push({t:m.kind==="task"?"task":"msg", m, ts:+new Date(m.created_at), id:m.id});
  }
  if (f.commits && d.git && d.git.commits)
    for (const c of d.git.commits) raw.push({t:"commit", c, ts:+new Date(c.date)});
  raw.sort((a,b)=> a.ts-b.ts || ((a.id||0)-(b.id||0)));
  const runs=collapseRuns(raw);
  /* window */
  const total=runs.length;
  const win=runs.slice(Math.max(0,total-S.ui.window));
  const out=[];
  if (total>win.length) out.push({t:"loadmore", n:total-win.length, key:"loadmore"});
  else if (d.capped) out.push({t:"term", key:"term", text:"Showing the last 300 messages (server limit)"});
  const mark=readMark(slug);
  let unreadDone=(d.pinnedUnread===undefined);
  let lastDay=null, prev=null;
  for (const it of win){
    const iso=it.t==="commit"?it.c.date:(it.m?it.m.created_at:new Date(it.ts).toISOString());
    const dk=dayKey(iso);
    if (dk!==lastDay){ out.push({t:"day", key:"d"+dk, iso}); lastDay=dk; prev=null; }
    if (!unreadDone && d.pinnedUnread && it.m && it.m.id===d.pinnedUnread){
      out.push({t:"new", key:"unread"}); unreadDone=true; prev=null;
    }
    it.grouped=groupWith(prev,it);
    out.push(it);
    if (it.t==="grun" && S.ui.sysOpen.has(it.key))
      for (const ch of it.items) out.push({...ch, child:true, key:childKey(ch)});
    prev=it;
  }
  return out;
}
function childKey(it){ return it.t==="commit" ? "cc"+it.c.short : "ct"+it.m.id; }
function itemKey(it){
  if (it.key) return it.key;
  if (it.t==="commit") return "c"+it.c.short;
  return "m"+it.m.id;
}
function itemFp(it){
  if (it.t==="msg"||it.t==="task") return it.m.id+":"+it.m.kind+":"+it.m.body.length+":"+(it.grouped?1:0)+":"+(it.child?1:0);
  if (it.t==="commit") return it.c.short+":"+(it.child?1:0);
  if (it.t==="grun") return it.key+":"+it.items.length+":"+(S.ui.sysOpen.has(it.key)?1:0);
  if (it.t==="loadmore") return "lm"+it.n;
  if (it.t==="day") return "d"+it.iso.slice(0,10);
  return it.t;
}

/* the owning project's task set, always - Activity used to format with whatever
   was selected, which permanently cached the newest messages with no task chips */
function tasksVer(slug){ const d=slug?S.byProject[slug]:null; return d?d.tasks.size:-1; }
function ctxFor(slug){
  const d=slug?pd(slug):null;
  return {tasks:d?d.tasks:null, tv:tasksVer(slug), clampAt:S.sel?9:CLAMP_MIN};
}
function mountBody(host, m, slug){
  const eager=S.ui.eager && S.ui.eager.has(m.id);
  if (eager || fmtCache.has(m.id)){ host.appendChild(formatBody(m, ctxFor(slug))); return; }
  const ph=el("div","bodywrap"); ph.dataset.mid=m.id; ph.dataset.pending="1";
  const b=el("div","body"); b.style.minHeight="22px";
  b.appendChild(el("p",null,m.body.slice(0,160)));
  ph.appendChild(b); host.appendChild(ph);
  S.ui.pending.push({ph, m, slug});

}
const bodyIO=new IntersectionObserver(es=>{
  for (const e of es) if (e.isIntersecting){ bodyIO.unobserve(e.target); fillBody(e.target); }
},{rootMargin:"600px 0px"});
function fillBody(ph, noPin){
  if (!ph.dataset.pending) return;
  const rec=S.ui.pending.find(p=>p.ph===ph);
  if (!rec) return;
  ph.dataset.pending="";
  /* a placeholder is shorter than the real report, so the list grows under the
     reader; pin to the bottom once per batch, never once per body (that read is
     a full layout of the scroller) */
  const sc=$("scroller");
  const atBottom=noPin?false:sc.scrollHeight-sc.scrollTop-sc.clientHeight<80;
  const real=formatBody(rec.m, ctxFor(rec.slug));
  if (ph.parentNode) ph.replaceWith(real);
  S.ui.pending=S.ui.pending.filter(p=>p!==rec);
  if (atBottom) sc.scrollTop=sc.scrollHeight;
}
let drainT=0;
function idleFormat(){
  if (drainT) return;
  drainT=setTimeout(function pump(){
    drainT=0;
    const sc=$("scroller");
    const atBottom=sc.scrollHeight-sc.scrollTop-sc.clientHeight<80;
    let n=24;
    while (S.ui.pending.length && n-- > 0){
      const rec=S.ui.pending[0];
      bodyIO.unobserve(rec.ph); fillBody(rec.ph, true);
    }
    if (atBottom) sc.scrollTop=sc.scrollHeight;
    if (S.ui.pending.length) idleFormat();
  }, 16);
}

function firstVisibleRow(sc){
  const top=sc.scrollTop;
  for (const c of sc.firstElementChild.children){
    if (c.offsetTop+c.offsetHeight>top) return {el:c, top:c.offsetTop-top};
  }

}
function paintTimeline(){
  const tl=$("timeline"), sc=$("scroller");
  parkActs();
  const items = S.sel ? buildItems(S.sel) : buildActivityItems();
  const atBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 80;
  const anchor = atBottom ? null : firstVisibleRow(sc);
  const first = S.ui.firstPaint || registry(tl).size===0;
  const known = S.ui.seen;
  /* previous branch memo so a commit repeats its branch tag only when it changes */
  let prevBranch="";
  for (const it of items){ if (it.t==="commit"){ it.prevBranch=prevBranch; prevBranch=commitBranch(it.c)||prevBranch; } }
  renderList(tl, items, itemKey, it=>{
    const e=createRowFor(it);
    if (!first && it.t==="msg" && !known.has(itemKey(it))) e.classList.add("row-enter");
    return e;
  }, patchRowFor, itemFp);
  for (const it of items) known.add(itemKey(it));
  S.ui.firstPaint=false;
  /* re-park the cluster on the row the pointer was last over; it is invisible
     unless that row is :hover, so a stale park costs nothing */
  if (S.ui.actsRow){
    const back=tl.querySelector('.row[data-msg="'+S.ui.actsRow+'"]');
    if (back) attachActs(back);
  }
  emptyState(items);
  if (atBottom) sc.scrollTop=sc.scrollHeight;
  else if (anchor && anchor.el.isConnected) sc.scrollTop=anchor.el.offsetTop-anchor.top;
  updateDays();

/* Only one day divider may stick at a time: siblings in one flat scroller would

function updateDays(){
  const sc=$("scroller"), days=$("timeline").querySelectorAll(".day");
  let stuck=null;
  for (const d of days){
    d.style.position="relative"; d.classList.remove("stuck");
    if (d.offsetTop-sc.scrollTop<=1) stuck=d;
  }
  if (stuck){ stuck.style.position="sticky"; stuck.classList.add("stuck"); }
}
function updateJump(items, atBottom){
  const sc=$("scroller"), j=$("jump");
  const far = sc.scrollHeight - sc.scrollTop - sc.clientHeight > 400;
  const msgs = items.filter(i=>i.t==="msg");
  const lastId = msgs.length?msgs[msgs.length-1].m.id:0;
  /* message ids are GLOBAL, so a difference of ids is not a count of anything.
     Count the rows that are actually newer; the id is only the watermark. */
  const newer = S.ui.lastSeenBottomId
    ? msgs.filter(i=>i.m.id>S.ui.lastSeenBottomId).length : 0;
  if (far && newer>0){
    j.style.display="flex";
    $("jump-t").textContent=newer+" new message"+(newer===1?"":"s");
  } else j.style.display="none";

function buildActivityItems(){
  const raw=S.activity.slice().reverse().map(m=>({
    t:m.kind==="task"?"task":"msg", m, ts:+new Date(m.created_at), id:m.id,
    slug:m.slug, withProject:true, key:"m"+m.id }));

  let lastDay=null;

  const list=ORDER.filter(n=>n!=="user").map(n=>({name:n, a:agentOf(n)}));
  list.sort((x,y)=>{ const ax=presState(x.a)==="p-now"?0:1, ay=presState(y.a)==="p-now"?0:1; return ax-ay; });
  const fp=list.map(x=>x.name+(x.a?x.a.last_seen:"")).join("|");
  if (host.dataset.fp===fp) return;
  host.dataset.fp=fp; resetList(host);
  for (const x of list){ const a=avatar(x.name,26,x.a); a.style.setProperty("--surf","var(--bg-app)"); host.appendChild(a); }
  const n=list.filter(x=>presState(x.a)==="p-now").length;
  $("pres-n").textContent=n+" active";
}
function presencePop(anchor){
  openPop(anchor,(p,close)=>{
    p.appendChild(el("div","hd","Agents"));
    for (const n of ORDER){
      const a=agentOf(n);
      popItem(p,n,{avatar:n, hue:hue(n), right:a?ago(a.last_seen):"never seen",
        onClick:()=>{ close(); if (S.sel && n!=="user") summon(n); }});
    }

}
function agentPop(anchor,name){
  openPop(anchor,(p,close)=>{
    const a=agentOf(name);
    p.appendChild(el("div","hd",name));
    popItem(p,a?("last seen "+ago(a.last_seen)):"never seen",{avatar:name,hue:hue(name)});

      popItem(p,"Summon here",{icon:"i-bolt",onClick:()=>{close();summon(name);}});
